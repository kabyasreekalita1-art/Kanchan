function svc(i){const v=D.services[i];if(!v)return"<section><div class='w'>Not found</div></section>";ev("svc",v.name);return `<section style="padding-top:130px"><div class="w" style="max-width:800px"><a class="mu" href="#/home/services">← All services</a><div class="ic" style="margin-top:20px">${e(v.icon)}</div><h1 style="font-size:clamp(32px,6vw,56px)" class="gt">${e(v.name)}</h1><p class="mu" style="font-size:18px">${e(v.desc)}</p><div class="card" style="margin:30px 0"><h3>What's included</h3><ul>${(v.features||[]).map(f=>`<li>${e(f)}</li>`).join("")}</ul>${v.price?`<p><b>Starting at ${e(v.price)}</b></p>`:""}</div>${form("pf1",1).replace(`<option>${e(v.name)}</option>`,`<option selected>${e(v.name)}</option>`)}</div></section>`}
const legal=(t,b)=>`<section style="padding-top:130px"><div class="w" style="max-width:780px"><h1 class="gt">${t}</h1>${b.map(x=>`<p class="mu">${x}</p>`).join("")}</div></section>`;
const PRIV=["KAZERA collects the details you submit through our forms (name, phone, email, project details) only to respond to your enquiry and deliver services.","We do not sell your data. Information is stored securely and shared only with team members who need it.","To request deletion of your data, email "+DEF.site.email+"."];
const TERMS=["By using this website and our services you agree to these terms.","Project scope, timelines and pricing are agreed in writing before work begins. Payments are non-refundable once work has started unless agreed otherwise.","We deliver organic growth strategies and do not guarantee specific follower or revenue numbers.","All final deliverables are transferred to the client after full payment."];
/* ADMIN */
let tab="dash",ds={leads:[],events:[]};
async function loadStats(){try{const[l,v]=await Promise.all([fb("leads","GET",undefined,1),fb("events","GET",undefined,1)]);const a=o=>Object.entries(o||{}).map(([id,x])=>({id,...x}));ds.leads=a(l).sort((x,y)=>y.ts-x.ts);ds.events=a(v)}catch{tok="";sessionStorage.removeItem("kzt");alert("Session expired. Please login again.");render()}}
const ST=["New","Contacted","In Discussion","Approved","Completed","Rejected"];
const cnt=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)};
const bars=(r)=>r.length?(mx=>r.map(([k,n])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${e(k)}</span><b>${n}</b></div><div class="bar" style="width:${Math.max(4,n/mx*100)}%"></div></div>`).join(""))(r[0][1]):'<p class="mu">No data yet</p>';
async function adminV(){
 if(!tok)return `<section style="padding-top:130px"><div class="w" style="max-width:420px"><form class="card" onsubmit="return login(event)"><h2>🔒 Admin Login</h2><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn p" style="width:100%">Login</button>${CFG.KEY?"":'<p class="mu">Set Firebase KEY in index.html first.</p>'}</form></div></section>`;
 if(["dash","leads","ana"].includes(tab))await loadStats();
 const T=[["out","Logout"],["dash","Dashboard"],["leads","Leads"],["ana","Analytics"],["site","Website"],...Object.keys(SCH).map(k=>[k,k[0].toUpperCase()+k.slice(1)])];
 let b="";const ev_=ds.events,L=ds.leads,day=new Date().setHours(0,0,0,0);
 const vis=new Set(ev_.filter(x=>x.t=="visit").map(x=>x.v)).size,tv=new Set(ev_.filter(x=>x.t=="visit"&&x.ts>=day).map(x=>x.v)).size,pv=ev_.filter(x=>x.t=="port").length,pr=L.filter(x=>x.type=="project");
 if(tab=="dash")b=`<div class="grid">${[["Total Visitors",vis],["Today's Visitors",tv],["Total Leads",L.length],["New Inquiries",L.filter(x=>x.status=="New").length],["Total Projects",pr.length],["Active Projects",pr.filter(x=>["Contacted","In Discussion","Approved"].includes(x.status)).length],["Completed Projects",pr.filter(x=>x.status=="Completed").length],["Contact Messages",L.filter(x=>x.type=="contact").length],["Service Requests",pr.length],["Portfolio Views",pv]].map(c=>`<div class="card"><div class="mu" style="font-size:13px">${c[0]}</div><div class="price gt">${c[1]}</div></div>`).join("")}</div>`;
 if(tab=="leads")b=`<div class="card tw"><table><tr><th>Date</th><th>Name</th><th>Contact</th><th>Service</th><th>Budget</th><th>Message</th><th>Status</th><th></th></tr>${L.map(l=>`<tr><td>${new Date(l.ts).toLocaleString()}</td><td>${e(l.name)}<br><small class="mu">${e(l.type)}</small></td><td>${e(l.phone)}<br>${e(l.email)}</td><td>${e(l.service)}</td><td>${e(l.budget||"-")}<br><small>${e(l.deadline||"")}</small></td><td>${e(l.msg)}</td><td><select onchange="ls('${l.id}',this.value)" style="width:140px">${ST.map(s=>`<option ${s==l.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn" onclick="ld('${l.id}')">🗑</button></td></tr>`).join("")||'<tr><td colspan=8 class="mu">No leads yet</td></tr>'}</table></div>`;
 if(tab=="ana"){const pg=cnt(ev_.filter(x=>x.t=="svc"||x.t=="port"),x=>x.k);b=`<div class="grid"><div class="card"><h3>Visitors per day</h3>${bars(cnt(ev_.filter(x=>x.t=="visit"),x=>new Date(x.ts).toLocaleDateString()))}</div><div class="card"><h3>Service popularity</h3>${bars(cnt(ev_.filter(x=>x.t=="svc"),x=>x.k))}</div><div class="card"><h3>Portfolio views</h3>${bars(cnt(ev_.filter(x=>x.t=="port"),x=>x.k))}</div><div class="card"><h3>Most visited pages</h3>${bars(pg)}</div><div class="card"><h3>Requests by service</h3>${bars(cnt(L,x=>x.service))}</div><div class="card"><h3>Conversion</h3><div class="price gt">${vis?(L.length/vis*100).toFixed(1):0}%</div><p class="mu">${L.length} leads (${pr.length} projects, ${L.length-pr.length} messages) from ${vis} visitors</p></div></div>`}
 if(tab=="site"){const s=D.site;b=`<div class="card">${SITEF.split(",").map(f=>fld(f,s[f.split(":")[0]],"site",0)).join("")}<button class="btn p" onclick="svSite()">Save</button> <button class="btn" onclick="rst('site')">Reset</button></div>`}
 if(SCH[tab])b=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${D[tab].map((it,i)=>`<div class="card" data-i="${i}">${SCH[tab].split(",").map(f=>fld(f,it[f.split(":")[0]],tab,i)).join("")}<button class="btn" onclick="del('${tab}',${i})">Delete</button></div>`).join("")}</div><p><button class="btn" onclick="add('${tab}')">+ Add</button> <button class="btn p" onclick="svList('${tab}')">Save all changes</button> <button class="btn" onclick="rst('${tab}')">Reset to defaults</button></p>`;
 return `<section style="padding-top:20px"><div class="w"><div class="tabs">${T.map(t=>`<span class="chip ${t[0]==tab?"on":""}" onclick="${t[0]=='out'?'logout()':`tab='${t[0]}';render()`}">${t[1]}</span>`).join("")}</div>${b}${assets?"":'<p class="mu">Image upload unavailable — paste image URLs.</p>'}</div></section>`}
function fld(f,v,col,i){const[k,t]=f.split(":");const n=`data-k="${k}" data-t="${t||""}"`;
 const lab=`<label>${k}${t=="l"?" (comma separated)":""}</label>`;
 if(t=="b")return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${n} style="width:auto;margin:0" ${v?"checked":""}> ${k}</label><br>`;
 if(t=="a")return lab+`<textarea ${n} rows="3">${e(v)}</textarea>`;
 if(t=="i")return lab+`<input ${n} value="${e(v)}" placeholder="Image URL"> ${assets?`<input type="file" accept="image/*" onchange="up(this)">`:""}`;
 return lab+`<input ${n} ${t=="n"?'type="number" min=1 max=5':""} value="${e(t=="l"?(v||[]).join(","):v)}">`}
async function up(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);inp.previousElementSibling.value=c.toDataURL("image/jpeg",.72)};im.src=URL.createObjectURL(f)}
const rd=c=>{const o={};c.querySelectorAll("[data-k]").forEach(x=>{const t=x.dataset.t;o[x.dataset.k]=t=="b"?x.checked:t=="l"?x.value.split(",").map(s=>s.trim()).filter(Boolean):t=="n"?+x.value:x.value});return o};
const put=async k=>{try{await fb("content/"+k,"PUT",{v:D[k]},1);alert("Saved ✓")}catch{alert("Save failed (admin access needed)")}render()};
function svSite(){D.site={...D.site,...rd($(".card"))};put("site")}
function svList(k){D[k]=[...document.querySelectorAll("[data-i]")].map(c=>rd(c));put(k)}
function add(k){svListQuiet(k);D[k].push({on:true});render()}
function svListQuiet(k){D[k]=[...document.querySelectorAll("[data-i]")].map(c=>rd(c))}
function del(k,i){if(!confirm("Delete?"))return;svListQuiet(k);D[k].splice(i,1);put(k)}
function rst(k){if(confirm("Reset to defaults?")){D[k]=JSON.parse(JSON.stringify(DEF[k]));put(k)}}
async function ls(id,s){try{await fb("leads/"+id+"/status","PUT",s,1)}catch{alert("Failed")}}
async function ld(id){if(confirm("Delete lead?")){try{await fb("leads/"+id,"DELETE",undefined,1)}catch{}render()}}
/* ROUTER */
async function render(){const h=location.hash.slice(2).split("/"),a=$("#app");const s=D.site;document.title=s.title;document.querySelector('meta[name=description]').content=s.meta;
 if(s.logo)document.querySelector(".logo").innerHTML=`<img src="${e(s.logo)}" alt="KAZERA" height="32">`;
 $("#wa").href="https://wa.me/91"+s.phone;$("#cl").href="tel:"+s.phone;nl.classList.remove("o");
 if(h[0]=="service")a.innerHTML=svc(+h[1]);else if(h[0]=="privacy")a.innerHTML=legal("Privacy Policy",PRIV);else if(h[0]=="terms")a.innerHTML=legal("Terms & Conditions",TERMS);else if(h[0]=="admin")a.innerHTML=await adminV();
 else{a.innerHTML=home()+foot();if(h[0]=="home"&&h[1])setTimeout(()=>document.getElementById(h[1])?.scrollIntoView({behavior:"smooth"}),50)}
 if(["service","privacy","terms"].includes(h[0]))a.innerHTML+=foot();
 io()}
function foot(){const s=D.site;return `<footer><div class="w fg"><div><div class="logo gt">KAZERA</div><p class="mu">Digital Growth. Creative Solutions.</p><div style="display:flex;gap:12px;font-size:13px"><a href="${e(s.ig)}">Instagram</a><a href="${e(s.fb)}">Facebook</a><a href="${e(s.yt)}">YouTube</a><a href="${e(s.li)}">LinkedIn</a></div></div><div><b>Quick Links</b><a href="#/home/services">Services</a><a href="#/home/about">About</a><a href="#/home/portfolio">Portfolio</a><a href="#/home/contact">Contact</a><a href="#/home/faq">FAQ</a></div><div><b>Contact</b><a href="tel:${e(s.phone)}">${e(s.phone)}</a><a href="mailto:${e(s.email)}">${e(s.email)}</a><a>${e(s.loc)}</a></div><div><b>Legal</b><a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms & Conditions</a><a href="#/admin">Admin</a></div></div><p class="mu w" style="font-size:12px;margin-top:30px">© ${new Date().getFullYear()} KAZERA. All rights reserved.</p></footer>`}
function io(){const o=new IntersectionObserver(r=>r.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");o.unobserve(x.target)}}),{threshold:.1});document.querySelectorAll(".rv").forEach(x=>o.observe(x))}
addEventListener("hashchange",()=>{render()});addEventListener("scroll",()=>$("#up").style.display=scrollY>600?"grid":"none",{passive:true});
/* particles */
(()=>{const c=$("#bg"),x=c.getContext("2d");let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:w<700?25:55},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,dx:(Math.random()-.5)*.25,dy:(Math.random()-.5)*.25}))};rs();addEventListener("resize",rs);
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
(function f(){x.clearRect(0,0,w,h);let g=x.createRadialGradient(w*.8,h*.1,0,w*.8,h*.1,w*.6);g.addColorStop(0,"rgba(139,92,246,.22)");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,w,h);g=x.createRadialGradient(w*.1,h*.8,0,w*.1,h*.8,w*.5);g.addColorStop(0,"rgba(34,211,238,.12)");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,w,h);
x.fillStyle="rgba(200,190,255,.5)";P.forEach(p=>{p.x=(p.x+p.dx+w)%w;p.y=(p.y+p.dy+h)%h;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
boot();
