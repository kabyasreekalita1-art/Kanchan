 if(tab=="reviews")b=`<div class="card"><h3>Add a review</h3><p class="mu">Only add feedback a real client gave you and allowed you to publish.</p><form onsubmit="return radd(event)"><div class="f2"><div><label>Name</label><input name="name" required></div><div><label>Rating (1-5)</label><input name="rating" type="number" min="1" max="5" required></div></div><label>Service</label><input name="svc"><label>Review text</label><textarea name="text" rows="3" required></textarea><button class="btn p">Publish review</button></form></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${ds.reviews.map(r=>`<div class="card"><div style="color:#fbbf24">${stars(r.rating)}</div><p>${e(r.text)}</p><b>${e(r.name)}</b> <small class="mu">${r.ok?"Published":"Pending"}</small><br><br><button class="btn" onclick="rok('${e(r.id)}',${!r.ok})">${r.ok?"Unpublish":"Approve"}</button> <button class="btn" onclick="rdel('${e(r.id)}')">🗑</button></div>`).join("")||'<p class="mu">No reviews yet</p>'}</div>`;
 if(tab=="site"){const s=D.site;b=`<div class="card">${SITEF.split(",").map(f=>fld(f,s[f.split(":")[0]],"site",0)).join("")}<button class="btn p" onclick="svSite()">Save</button> <button class="btn" onclick="rst('site')">Reset</button></div>`}
 if(SCH[tab])b=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${D[tab].map((it,i)=>`<div class="card" data-i="${i}">${SCH[tab].split(",").map(f=>fld(f,it[f.split(":")[0]],tab,i)).join("")}<button class="btn" onclick="del('${tab}',${i})">Delete</button></div>`).join("")}</div><p><button class="btn" onclick="add('${tab}')">+ Add</button> <button class="btn p" onclick="svList('${tab}')">Save all changes</button> <button class="btn" onclick="rst('${tab}')">Reset to defaults</button></p>`;
 return `<section style="padding-top:20px"><div class="w"><div class="tabs">${T.map(t=>`<span class="chip ${t[0]==tab?"on":""}" onclick="${t[0]=='out'?'logout()':`tab='${t[0]}';render()`}">${t[1]}</span>`).join("")}</div>${b}${assets?"":'<p class="mu">Image upload unavailable — paste image URLs.</p>'}</div></section>`}
function fld(f,v,col,i){const[k,t]=f.split(":");const n=`data-k="${k}" data-t="${t||""}"`;
 const lab=`<label>${k}${t=="l"?" (comma separated)":""}</label>`;
 if(t=="m")return `<label>${k} (one URL per line, or upload)</label><textarea ${n} rows="3" oninput="pvs(this)" placeholder="Image URL">${e((v||[]).join("\n"))}</textarea>${assets?`<input type="file" accept="image/*" multiple onchange="upm(this)">`:""}<div class="pv">${thumbs(v||[])}</div>`;
 if(t=="c")return lab+`<input type="color" ${n} value="${e(v||"#7c3aed")}" style="padding:4px;height:46px">`;
 if(t=="b")return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${n} style="width:auto;margin:0" ${v?"checked":""}> ${k}</label><br>`;
 if(t=="a")return lab+`<textarea ${n} rows="3">${e(v)}</textarea>`;
 if(t=="i")return lab+`<input ${n} value="${e(v)}" placeholder="Image URL"> ${assets?`<input type="file" accept="image/*" onchange="up(this)">`:""}`;
 return lab+`<input ${n} ${t=="n"?'type="number" min=1 max=5':""} value="${e(t=="l"?(v||[]).join(","):v)}">`}
const thumbs=a=>a.map((u,i)=>`<span style="position:relative;display:inline-block;margin:8px 8px 0 0"><img src="${e(u)}" alt="" style="height:70px;border-radius:10px;display:block"><b onclick="rmi(this,${i})" style="position:absolute;top:-7px;right:-7px;background:#1a8fff;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:14px;cursor:pointer">×</b></span>`).join("");
const lines=ta=>ta.value.split("\n").map(s=>s.trim()).filter(Boolean);
function pvs(ta){ta.parentNode.querySelector(".pv").innerHTML=thumbs(lines(ta))}
function rmi(b,i){const ta=b.closest(".card").querySelector('textarea[data-t="m"]'),a=lines(ta);a.splice(i,1);ta.value=a.join("\n");pvs(ta)}
async function upm(inp){const ta=inp.previousElementSibling;for(const f of inp.files){await new Promise(res=>{const im=new Image();im.onload=()=>{const m=1000,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ta.value=(ta.value.trim()?ta.value.trim()+"\n":"")+c.toDataURL("image/jpeg",.72);res()};im.onerror=res;im.src=URL.createObjectURL(f)})}pvs(ta);inp.value=""}
async function up(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);inp.previousElementSibling.value=c.toDataURL("image/jpeg",.72)};im.src=URL.createObjectURL(f)}
const rd=c=>{const o={};c.querySelectorAll("[data-k]").forEach(x=>{const t=x.dataset.t;o[x.dataset.k]=t=="b"?x.checked:t=="m"?x.value.split("\n").map(s=>s.trim()).filter(Boolean):t=="l"?x.value.split(",").map(s=>s.trim()).filter(Boolean):t=="n"?+x.value:x.value});return o};
const put=async k=>{try{await fb("content/"+k,"PUT",{v:D[k],ver:2},1);alert("Saved ✓")}catch{alert("Save failed (admin access needed)")}render()};
function svSite(){D.site={...D.site,...rd($(".card"))};put("site")}
function svList(k){D[k]=[...document.querySelectorAll("[data-i]")].map(c=>rd(c));put(k)}
function add(k){svListQuiet(k);D[k].push({on:true});render()}
function svListQuiet(k){D[k]=[...document.querySelectorAll("[data-i]")].map(c=>rd(c))}
function del(k,i){if(!confirm("Delete?"))return;svListQuiet(k);D[k].splice(i,1);put(k)}
function rst(k){if(confirm("Reset to defaults?")){D[k]=JSON.parse(JSON.stringify(DEF[k]));put(k)}}
async function rok(id,v){try{await fb("reviews/"+id+"/ok","PUT",v,1)}catch{alert("Failed")}render()}
async function rdel(id){if(confirm("Delete review?")){try{await fb("reviews/"+id,"DELETE",undefined,1)}catch{}render()}}
async function radd(x){x.preventDefault();const o=Object.fromEntries(new FormData(x.target));try{await fb("reviews/"+uid(),"PUT",{name:o.name.trim(),rating:Math.min(5,Math.max(1,Math.round(+o.rating))),text:o.text.trim(),svc:(o.svc||"").trim(),ok:true,ts:Date.now()},1);alert("Published ✓")}catch{alert("Failed")}render();return false}
async function ls(id,s){try{await fb("leads/"+id+"/status","PUT",s,1)}catch{alert("Failed")}}
async function ld(id){if(confirm("Delete lead?")){try{await fb("leads/"+id,"DELETE",undefined,1)}catch{}render()}}
/* ROUTER */
async function render(){const h=location.hash.slice(2).split("/"),a=$("#app");const s=D.site;document.title=s.title;document.querySelector('meta[name=description]').content=s.meta;
 if(s.logo)document.querySelector(".logo").innerHTML=`<img src="${e(s.logo)}" alt="KAZERA" height="32">`;
 $("#wa").href="https://wa.me/91"+s.phone;$("#cl").href="tel:"+s.phone;nl.classList.remove("o");document.querySelector(".menu").classList.remove("x");
 if(h[0]=="service")a.innerHTML=svc(+h[1]);else if(h[0]=="privacy")a.innerHTML=legal("Privacy Policy",PRIV);else if(h[0]=="terms")a.innerHTML=legal("Terms &amp; Conditions",TERMS);else if(h[0]=="admin")a.innerHTML=await adminV();
 else{a.innerHTML=home()+foot();if(h[0]=="home"&&h[1])setTimeout(()=>document.getElementById(h[1])?.scrollIntoView({behavior:"smooth"}),50)}
 if(["service","privacy","terms"].includes(h[0]))a.innerHTML+=foot();
 io()}
function foot(){const s=D.site;return `<footer><div class="w fg"><div><a href="#/" class="logo" aria-label="KAZERA"><img src="${e(s.logo||"logo.png")}" alt="KAZERA" style="display:block;height:28px;width:auto"></a><p class="mu">Digital Growth. Creative Solutions.</p><div style="display:flex;gap:12px;font-size:13px"><a href="${e(s.ig)}">Instagram</a><a href="${e(s.fb)}">Facebook</a><a href="${e(s.yt)}">YouTube</a><a href="${e(s.li)}">LinkedIn</a></div></div><div><b>Quick Links</b><a href="#/home/services">Services</a><a href="#/home/about">About</a><a href="#/home/portfolio">Our Work</a><a href="#/home/contact">Contact</a></div><div><b>Contact</b><a href="tel:${e(s.phone)}">${e(s.phone)}</a><a href="mailto:${e(s.email)}">${e(s.email)}</a><a>${e(s.loc)}</a></div><div><b>Legal</b><a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms & Conditions</a><a href="#/admin">Admin</a></div></div><p class="mu w" style="font-size:12px;margin-top:30px">© ${new Date().getFullYear()} KAZERA. All rights reserved.</p></footer>`}
function io(){const o=new IntersectionObserver(r=>r.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");o.unobserve(x.target)}}),{threshold:.1});document.querySelectorAll(".rv").forEach(x=>o.observe(x));cntUp()}
addEventListener("hashchange",()=>{render()});addEventListener("scroll",()=>$("#up").style.display=scrollY>600?"grid":"none",{passive:true});
boot();
</script></body></html>
