<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAZERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a;--white:#fafafa;--charcoal:#232323;--line:#3a3a3a;--muted:#9a9a9a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;letter-spacing:-0.03em;line-height:1.02}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

/* announcement */
#announce{background:var(--white);color:var(--black);text-align:center;font-size:12px;font-weight:700;letter-spacing:.04em;padding:8px 12px;overflow:hidden;white-space:nowrap}
#announce span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:16px}
.logo{font-size:24px;font-weight:900;letter-spacing:-0.04em}
nav.main{display:flex;gap:26px;font-size:13px;font-weight:700;letter-spacing:.03em}
nav.main a{opacity:.85;padding-bottom:2px;border-bottom:1px solid transparent}
nav.main a:hover{opacity:1;border-color:var(--white)}
.navicons{display:flex;align-items:center;gap:16px;font-size:19px}
.navicons button{background:none;border:none;color:var(--white);position:relative}
#cartCount{position:absolute;top:-6px;right:-8px;background:var(--white);color:var(--black);font-size:10px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center}
#menuBtn{display:none;background:none;border:none;color:var(--white);font-size:22px}
#searchBox{display:none;padding:10px 20px;border-bottom:1px solid var(--line)}
#searchBox input{width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--white);padding:10px 12px;font-size:14px}

/* hero */
.hero{position:relative;padding:90px 20px 70px;text-align:center;border-bottom:1px solid var(--line);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(42px,9vw,96px);text-transform:uppercase}
.hero p{color:var(--muted);max-width:480px;margin:18px auto 30px;font-size:15px}
.btn{display:inline-block;padding:14px 30px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--white);transition:transform .25s ease,background .25s ease,color .25s ease}
.btn-solid{background:var(--white);color:var(--black)}
.btn-solid:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--white)}
.btn-outline:hover{background:var(--white);color:var(--black)}

/* sections */
.section{padding:64px 20px;border-bottom:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:16px}
.section-head h2{font-size:clamp(26px,4vw,38px);text-transform:uppercase}
.section-head a{font-size:12px;font-weight:800;letter-spacing:.05em;border-bottom:1px solid var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--charcoal);border:1px solid var(--line);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:#666}
.card .imgbox{aspect-ratio:4/5;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.card .imgbox img{width:100%;height:100%;object-fit:cover}
.card .info{padding:14px}
.card .info h3{font-size:14px;text-transform:none;letter-spacing:0;font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--white);color:var(--black);padding:3px 7px;margin-bottom:8px}
.price-row{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:14px}
.mrp{color:var(--muted);text-decoration:line-through;font-size:12px}

/* offer strips */
.offer{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;background:var(--charcoal);border:1px dashed var(--line);padding:22px 26px;margin-bottom:16px}
.offer h3{font-size:18px;text-transform:uppercase}
.offer p{color:var(--muted);font-size:13px;margin-top:4px}
.code{font-family:monospace;background:var(--black);border:1px solid var(--line);padding:8px 14px;font-weight:800;letter-spacing:.05em}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.filters button{background:transparent;border:1px solid var(--line);color:var(--white);padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.filters button.active{background:var(--white);color:var(--black);border-color:var(--white)}

/* product detail */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.pd .imgbox{aspect-ratio:4/5;background:#1a1a1a}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.opt-row button{border:1px solid var(--line);background:transparent;color:var(--white);padding:8px 14px;font-size:12px;font-weight:700}
.opt-row button.active{background:var(--white);color:var(--black)}
.qty{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.qty button{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--white);font-size:16px}
.review{border-top:1px solid var(--line);padding:16px 0}
.stars{color:#f4c542;font-size:14px;letter-spacing:2px}
.review img,.review video{max-width:160px;margin-top:8px}

/* forms */
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.form-field input,.form-field textarea,.form-field select{width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--white);padding:12px;font-size:14px;font-family:inherit}
.form-field textarea{resize:vertical;min-height:80px}

/* cart */
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}
.cart-line .meta{font-size:12px;color:var(--muted)}

/* popup */
#popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#popup-box{background:var(--white);color:var(--black);max-width:380px;width:100%;padding:36px 28px;text-align:center;position:relative}
#popup-box button.close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;color:var(--black)}

/* whatsapp float */
#wa-float{position:fixed;bottom:24px;right:20px;z-index:80;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.4);border:none}

footer{padding:40px 20px 30px;text-align:center;color:var(--muted);font-size:12px}
footer .flinks{display:flex;justify-content:center;gap:18px;margin-bottom:14px;font-weight:700}

/* admin */
.admin-wrap{display:flex;min-height:100vh}
.admin-side{width:210px;background:var(--charcoal);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0}
.admin-side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--white);padding:12px 20px;font-size:13px;font-weight:700}
.admin-side button.active{background:var(--white);color:var(--black)}
.admin-main{flex:1;padding:28px;overflow-x:auto}
.admin-main h2{font-size:24px;margin-bottom:20px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{border-bottom:1px solid var(--line);padding:10px;text-align:left}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.stat-card{background:var(--charcoal);border:1px solid var(--line);padding:18px}
.stat-card .num{font-size:26px;font-weight:800}
.stat-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.admin-card{background:var(--charcoal);border:1px solid var(--line);padding:18px;margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small-btn{border:1px solid var(--line);background:transparent;color:var(--white);padding:6px 12px;font-size:11px;font-weight:700}
.badge{padding:3px 8px;font-size:10px;font-weight:800;text-transform:uppercase}
.badge.Pending{background:#5a4a1a;color:#ffd66b}
.badge.Confirmed{background:#1a3a5a;color:#7ec8ff}
.badge.Shipped{background:#3a2a5a;color:#c7a3ff}
.badge.Delivered{background:#1a5a2a;color:#7dffa0}

@media(max-width:860px){
  nav.main{display:none}
  #menuBtn{display:block}
  .pd{grid-template-columns:1fr}
  .admin-wrap{flex-direction:column}
  .admin-side{width:100%;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .admin-side button{white-space:nowrap}
  .row2{grid-template-columns:1fr}
}
#mobileNav{display:none;flex-direction:column;background:var(--black);border-bottom:1px solid var(--line);padding:10px 20px}
#mobileNav a{padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}

/* KAZERA enhancements: discounts, festival campaign and order tracking */
.discount-pill{display:inline-block;background:#d7ff00;color:#080808;font-size:10px;font-weight:900;letter-spacing:.04em;padding:5px 8px;margin:0 0 8px}
.savings{color:#d7ff00;font-size:12px;font-weight:800;margin-top:5px}
.festival-hero{background:linear-gradient(115deg,#4b090d,#941d27 58%,#d78a27);border:1px solid #ffffff22;padding:28px;margin:0 0 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.festival-hero h2{font-size:clamp(25px,5vw,42px);margin:8px 0;text-transform:uppercase}
.festival-hero p{color:#ffe8dc;font-size:14px;line-height:1.5}
.festival-hero .fest-kicker{font-size:11px;font-weight:900;letter-spacing:.15em}
.festival-hero .fest-code{display:inline-block;background:#111;color:#fff;padding:8px 12px;font-family:monospace;font-weight:900;margin-top:12px}
.tracking-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.tracking-step{border-top:3px solid #444;padding-top:8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
.tracking-step.done{border-color:#d7ff00;color:#fff}
.track-meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;overflow-wrap:anywhere}
.track-link{display:inline-block;margin-top:10px;color:#d7ff00;text-decoration:underline;font-size:13px;font-weight:800}
.admin-track-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.admin-track-grid input,.admin-track-grid select{min-width:0;width:100%;background:var(--black);border:1px solid var(--line);color:var(--white);padding:9px;font-size:12px}
@media(max-width:600px){.festival-hero{padding:20px;align-items:flex-start}.festival-hero .fest-symbol{display:none}.tracking-steps{gap:5px}.tracking-step{font-size:9px}.admin-track-grid{grid-template-columns:1fr}}

/* ===== KAZERA shop redesign (black + yellow) ===== */
:root{--accent:#ffd21f}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#announce{background:#0a0a0a;color:var(--accent);border-bottom:1px solid #262626;letter-spacing:.06em}
nav.main a.active{color:var(--accent);opacity:1;border-color:var(--accent)}
#cartCount{background:var(--accent);color:#000}
#wishCount{position:absolute;top:-6px;right:-8px;background:#e53935;color:#fff;font-size:10px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:none;align-items:center;justify-content:center}
.navicons button{display:flex}
.discount-pill{background:var(--accent);color:#000}
.savings,.track-link{color:var(--accent)}
.tracking-step.done{border-color:var(--accent)}

.shop-hero{position:relative;overflow:hidden;min-height:300px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 78% 40%,#2a2a2a 0%,#0a0a0a 65%)}
.shop-hero .sh-text{position:relative;z-index:2;padding:34px 24px 34px max(24px,calc((100vw - 1180px)/2 + 20px));max-width:640px}
.sh-kicker{font-size:clamp(16px,3vw,26px);letter-spacing:.22em;font-weight:500}
.sh-title{font-family:'Anton','Impact','Arial Narrow',sans-serif;font-weight:400;font-style:italic;color:var(--accent);font-size:clamp(46px,9vw,92px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:6px 0 10px;transform:skewX(-6deg);transform-origin:left}
.sh-sub{display:flex;align-items:center;gap:12px;font-size:clamp(11px,1.8vw,16px);letter-spacing:.3em;color:#ddd}
.sh-sub i{display:block;height:1px;width:34px;background:#777;flex-shrink:0}
.sh-sign{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(24px,4vw,40px);margin-top:14px;color:#f2f2f2}
.sh-img{position:absolute;right:0;top:0;bottom:0;width:58%;z-index:1}
.sh-img img{width:100%;height:100%;object-fit:cover;object-position:center 20%;-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
.sh-side{position:absolute;right:26px;top:50px;z-index:3;font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(16px,2.6vw,28px);line-height:1.1;transform:rotate(-8deg);color:#fff;text-align:left;text-shadow:0 2px 8px #000}
.sh-side b{color:var(--accent);font-weight:400}

.shop-pills{display:flex;gap:12px;flex-wrap:wrap;padding:22px 0 18px}
.shop-pills button{background:transparent;border:1px solid var(--line);color:var(--white);padding:11px 26px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.shop-pills button.active{background:var(--accent);border-color:var(--accent);color:#000}
.shop-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0;border-top:1px solid #262626;margin-bottom:18px;position:relative}
.shop-bar .tb{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--white);font-size:14px;font-weight:600;padding:6px 0}
.shop-bar .tb .ico{width:18px;height:18px}
.shop-bar .sortwrap{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid #333}
.shop-bar select{background:transparent;color:var(--white);border:none;font-size:14px;font-weight:600;font-family:inherit;padding:6px 0;cursor:pointer}
.shop-bar select option{background:#111;color:#fff}
.shop-bar .count{margin-left:auto;color:#cfcfcf;font-size:13px}
.shop-bar .views{display:flex;gap:4px}
.shop-bar .views button{background:none;border:none;color:#777;padding:4px;border-bottom:2px solid transparent}
.shop-bar .views button.on{color:var(--accent);border-color:var(--accent)}
.fpanel{background:#141414;border:1px solid #2c2c2c;border-radius:8px;padding:16px 18px;margin:-6px 0 18px;display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.fpanel label.ck{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.fpanel input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.fpanel .sz{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600}
.fpanel .sz button{border:1px solid var(--line);background:transparent;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700}
.fpanel .sz button.on{background:var(--accent);border-color:var(--accent);color:#000}
.fpanel .clr{margin-left:auto;background:none;border:none;color:var(--accent);font-size:12px;font-weight:800;text-decoration:underline}

.grid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
.card{background:#111;border:1px solid #2a2a2a;border-radius:8px;display:flex;flex-direction:column}
.card:hover{border-color:#5c5c5c}
.card .cimg{position:relative}
.card .imgbox{display:flex;aspect-ratio:1/1.02;background:#e6e6e8;color:#111}
.card .imgbox img{object-fit:cover}
.card .info{padding:14px 14px 16px;display:flex;flex-direction:column;flex:1}
.card .info h3{font-size:14px;line-height:1.25}
.card .sub{color:#b5b5b5;font-size:13px;margin-top:4px}
.card .rate{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#cfcfcf}
.st{position:relative;display:inline-block;color:#444;font-size:13px;line-height:1}
.st span{position:absolute;left:0;top:0;overflow:hidden;color:var(--accent);white-space:nowrap}
.card .price-row{flex-wrap:wrap;gap:6px 8px;margin-top:10px;align-items:center}
.card .price-row strong{font-size:22px;letter-spacing:-.02em}
.card .price-row .mrp{font-size:13px}
.card .price-row .discount-pill{margin:0;font-size:10px;padding:4px 7px;border-radius:3px}
.card .addbtn{margin-top:auto;width:100%;background:var(--accent);color:#000;border:none;border-radius:4px;padding:12px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px}
.card .addbtn .ico{width:18px;height:18px}
.card .addbtn:disabled{background:#333;color:#888;cursor:not-allowed}
.card .addwrap{margin-top:12px;padding-top:0}
.cbadge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--accent);color:#000;z-index:2}
.cbadge.new{background:#e53935;color:#fff}
.heart{position:absolute;top:8px;right:8px;z-index:2;background:none;border:none;color:#222;padding:4px}
.heart .ico{width:24px;height:24px}
.heart.on{color:#e53935}
.heart.on .ico{fill:#e53935}
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row}
.grid.list .card .cimg{width:170px;flex-shrink:0}
.grid.list .card .imgbox{height:100%;aspect-ratio:auto;min-height:190px}

.trust{display:flex;align-items:center;gap:28px;flex-wrap:wrap;border-top:1px solid #262626;padding:24px 0 6px;margin-top:34px}
.trust .ti{display:flex;align-items:center;gap:14px;padding-right:28px;border-right:1px solid #2c2c2c}
.trust .ti:last-of-type{border-right:none}
.trust .ti .ico{width:34px;height:34px;color:var(--accent);flex-shrink:0}
.trust .ti b{display:block;font-size:14px}
.trust .ti span{display:block;font-size:12px;color:#aaa;margin-top:2px}
.trust .wear{margin-left:auto;font-family:'Kaushan Script','Brush Script MT',cursive;font-size:24px;color:var(--accent)}

#qa-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:220;display:flex;align-items:flex-end;justify-content:center}
#qa-box{background:#141414;border:1px solid #2c2c2c;border-radius:14px 14px 0 0;width:100%;max-width:440px;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:601px){#qa-overlay{align-items:center}#qa-box{border-radius:14px}}
#qa-box h4{font-size:16px;margin-bottom:4px}
#qa-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
#qa-box .chips{display:flex;gap:8px;flex-wrap:wrap}
#qa-box .chips button{border:1px solid var(--line);background:transparent;color:#fff;padding:9px 15px;border-radius:6px;font-size:13px;font-weight:700}
#qa-box .chips button.on{background:var(--accent);border-color:var(--accent);color:#000}

@media(max-width:860px){.sh-img{width:75%;opacity:.75}.shop-hero{min-height:240px}.shop-bar .count{margin-left:0;width:100%;order:9}}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .shop-pills{gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:16px}
  .shop-pills button{padding:10px 18px;white-space:nowrap;font-size:12px}
  .card .info{padding:11px 10px 12px}
  .card .price-row strong{font-size:18px}
  .card .addbtn{padding:11px 6px;font-size:11px}
  .sh-side{display:none}
  .trust{gap:16px}.trust .ti{border-right:none;padding-right:0;width:100%}.trust .wear{margin-left:0}
  .grid.list .card .cimg{width:120px}
}

/* ===== Order details page + footer ===== */
#announce{display:flex;align-items:center;gap:18px;text-align:left;padding:8px 16px}
.ann-scroll{flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.ann-soc{display:flex;align-items:center;gap:14px;flex-shrink:0;color:#fff;font-size:11px;letter-spacing:.02em}
.ann-soc em{font-style:normal;font-weight:700}
.ann-soc a{display:flex;color:#fff}
.ann-soc .ico{width:16px;height:16px}
.od-hero{min-height:200px}
.od-hero .sh-text{padding-top:26px;padding-bottom:22px}
.od-title{font-family:'Kaushan Script','Brush Script MT',cursive;color:#fff;font-size:clamp(38px,8vw,74px);line-height:1.05;text-transform:uppercase;transform:skewX(-5deg);transform-origin:left;font-weight:400;text-shadow:0 2px 0 #000}
.od-swash{display:block;width:min(430px,88%);height:14px;margin:-2px 0 10px}
.od-crumb{font-size:13px;color:#cfcfcf;display:flex;gap:10px;flex-wrap:wrap}
.od-crumb a:hover{color:var(--accent)}
.od-crumb span:last-child{color:#fff}
.od-sig{position:absolute;right:26px;top:36px;z-index:3;font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(20px,3.4vw,34px);line-height:1.15;transform:rotate(-7deg);text-shadow:0 2px 8px #000}
.od-sig small{display:block;font-size:.62em;color:#ddd}
.od-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;padding:24px 0 10px}
.od-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.od-card{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;padding:20px 22px}
.od-card h2{font-size:18px;letter-spacing:0;margin-bottom:16px;display:flex;align-items:center;gap:10px;text-transform:none}
.od-card h2 .ico{width:22px;height:22px}
.od-top{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.od-okic{width:54px;height:54px;border-radius:50%;background:#2ecc71;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.od-okic.bad{background:#e53935}
.od-okic .ico{width:30px;height:30px;stroke-width:2.6}
.od-top h2{margin:0 0 4px;font-size:22px}
.od-top p{font-size:14px;color:#ddd}
.od-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #555;background:transparent;color:#fff;border-radius:6px;padding:10px 16px;font-size:12px;font-weight:700}
.od-btn:hover{border-color:var(--accent);color:var(--accent)}
.od-btn .ico{width:16px;height:16px}
.od-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid #2a2a2a;margin-top:18px;padding-top:16px}
.od-facts>div{padding:0 16px;border-left:1px solid #2a2a2a}
.od-facts>div:first-child{padding-left:0;border-left:none}
.od-facts small{display:block;font-size:12px;color:#bbb;margin-bottom:4px}
.od-facts b{font-size:19px}
.od-facts .cp{background:none;border:none;color:#bbb;margin-left:8px;vertical-align:middle}
.od-facts .cp .ico{width:16px;height:16px}
.od-facts .note{font-size:11px;color:#aaa;font-weight:400}
.od-tl{display:flex;margin-top:6px}
.od-st{flex:1;text-align:center;position:relative;padding:0 3px;min-width:0}
.od-st::before{content:"";position:absolute;top:19px;right:50%;width:100%;height:3px;background:#3a3a3a}
.od-st:first-child::before{display:none}
.od-st.done::before,.od-st.cur::before{background:#2ecc71}
.od-dot{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;border:2px solid #444;background:#111;color:#888}
.od-dot .ico{width:18px;height:18px}
.od-st.done .od-dot{background:#2ecc71;border-color:#2ecc71;color:#fff}
.od-st.cur .od-dot{background:#1f7a46;border-color:#2ecc71;color:#fff;box-shadow:0 0 0 4px rgba(46,204,113,.2)}
.od-st b{display:block;font-size:12px;line-height:1.25}
.od-st span{display:block;font-size:11px;color:#aaa;margin-top:3px}
.od-st.fut b{font-weight:500;color:#cfcfcf}
.od-cancelled .od-st.done::before,.od-cancelled .od-st.cur::before{background:#3a3a3a}
.od-cnote{background:#2a1214;border:1px solid #6b2226;color:#ffb3b3;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.od-track{margin-top:16px;padding-top:14px;border-top:1px solid #2a2a2a;font-size:13px;line-height:1.7;color:#ddd}
.od-itemhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.od-itemhd h2{margin:0}
.od-itemhd span{font-size:13px;color:#ddd}
.od-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #2a2a2a}
.od-thumb{width:96px;height:106px;flex-shrink:0;background:#e6e6e8;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#111;font-size:30px}
.od-thumb img{width:100%;height:100%;object-fit:cover}
.od-idet{flex:1;min-width:0}
.od-idet b{font-size:15px}
.od-idet .sub{font-size:13px;color:#c8c8c8;margin-top:3px}
.od-meta{font-size:13px;color:#ddd;margin-top:9px}
.od-meta i{font-style:normal;margin:0 10px;color:#555}
.od-bd{display:inline-block;margin-top:9px;font-size:10px;font-weight:900;letter-spacing:.04em;padding:4px 8px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);text-transform:uppercase}
.od-bd.new{border-color:#e53935;color:#ff6b68}
.od-iprice{text-align:right;flex-shrink:0}
.od-iprice b{font-size:18px}
.od-iprice s{color:#999;font-size:13px;margin-right:6px}
.od-iprice .discount-pill{margin:0;font-size:10px;padding:4px 7px;border-radius:3px;background:#e53935;color:#fff}
.od-iprice div{margin-top:8px}
.od-rows{padding-top:8px}
.od-row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
.od-row.g b,.od-row.g{color:#2ecc71}
.od-row.tot{border-top:1px solid #2a2a2a;margin-top:6px;padding-top:14px;font-size:17px;font-weight:800}
.od-save{display:flex;align-items:center;gap:12px;border:1px solid var(--accent);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:13px}
.od-save b{color:#2ecc71;font-size:15px}
.od-save .pc{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
.od-help p.h{font-size:14px;color:#ddd;margin:-8px 0 16px 0}
.od-help a,.od-help button.hl{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:14px;background:none;border:none;color:#fff;text-align:left;width:100%}
.od-help .ico{width:20px;height:20px;flex-shrink:0}
.od-qa{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;border-top:1px solid #2a2a2a;color:#fff;text-align:left;padding:14px 0}
.od-qa:first-of-type{border-top:none}
.od-qa .ci{width:44px;height:44px;border-radius:50%;border:1px solid #444;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.od-qa .ci .ico{width:20px;height:20px}
.od-qa b{display:block;font-size:14px}
.od-qa small{display:block;font-size:12px;color:#aaa;margin-top:2px}
.od-qa .ar{margin-left:auto;color:#aaa}
.od-qa.off{opacity:.55}
.od-quote{position:relative;overflow:hidden;min-height:220px;padding:0;background:radial-gradient(ellipse at 75% 40%,#2a2a2a,#0a0a0a 70%)}
.od-quote img{position:absolute;right:0;top:0;height:100%;width:65%;object-fit:cover;object-position:center 20%;-webkit-mask-image:linear-gradient(to left,#000 50%,transparent);mask-image:linear-gradient(to left,#000 50%,transparent)}
.od-quote .qt{position:relative;z-index:2;padding:26px 24px;max-width:70%}
.od-quote .qs{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:28px}
.od-quote .qq{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:19px;line-height:1.35;margin-top:14px;color:#eee}
.od-gate{max-width:420px;margin:0 auto;text-align:center;padding:50px 0}
footer{text-align:left;padding:0;color:#ccc;font-size:13px;border-top:1px solid #262626;background:#0a0a0a}
.foot{display:grid;grid-template-columns:1.25fr .9fr 1fr 1.1fr auto;gap:30px;padding-top:34px;padding-bottom:26px}
.foot h5{font-size:13px;margin-bottom:14px;color:#fff}
.foot .logo{display:block;margin-bottom:10px}
.foot a{display:block;color:#ccc;margin-bottom:9px;font-size:13px}
.foot a:hover{color:var(--accent)}
.foot .ftag{color:#fff;font-size:13px;margin-bottom:8px}
.foot .fdesc{color:#999;font-size:12px;line-height:1.6}
.foot .fsoc{display:flex;gap:14px;margin:0 0 14px}
.foot .fsoc a{margin:0;display:flex}
.foot .fsoc .ico{width:22px;height:22px}
.foot .fcontact{color:#999;font-size:12px;line-height:1.7;word-break:break-word}
.foot .fsign{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:26px;line-height:1.15;color:#e53935;transform:rotate(-6deg);align-self:center;padding-left:26px;border-left:1px solid #262626}
.fbottom{border-top:1px solid #262626;text-align:center;color:#aaa;font-size:12px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.fbottom b{color:#fff}
.badge.Cancelled{background:#5a1a1a;color:#ff8f8f}
@media(max-width:900px){.od-grid{grid-template-columns:1fr}.foot{grid-template-columns:1fr 1fr}.foot .fsign{border-left:none;padding-left:0;align-self:start}}
@media(max-width:600px){
  .ann-soc{display:none}
  .od-card{padding:16px}
  .od-facts{grid-template-columns:1fr;gap:12px}.od-facts>div{padding:0;border-left:none}
  .od-tl{margin-left:-6px;margin-right:-6px}.od-st b{font-size:10.5px}.od-st span{font-size:9.5px}.od-dot{width:32px;height:32px}.od-st::before{top:16px}
  .od-item{flex-wrap:wrap}.od-thumb{width:78px;height:88px}.od-iprice{width:100%;text-align:left;display:flex;align-items:center;gap:12px}.od-iprice div{margin:0}
  .od-sig{display:none}
  .od-quote .qt{max-width:100%}
  .foot{grid-template-columns:1fr}
}

<!-- Firebase (shared live database — this is what makes admin edits show on every visitor's device) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ---------------- FIREBASE CONFIG ----------------
   Connected to the "kazera-store" Firebase project's Realtime Database.
   This is what makes admin panel changes show up live on every device.
------------------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyCMaWJ-GC-11Fsuwa8idbv5aPdHNywDwSk",
  authDomain: "kazera-store.firebaseapp.com",
  databaseURL: "https://kazera-store-default-rtdb.firebaseio.com",
  projectId: "kazera-store",
  storageBucket: "kazera-store.firebasestorage.app",
  messagingSenderId: "386199897714",
  appId: "1:386199897714:web:e48f3ed9547774d85ea4eb"
};

/* ---------------- DATA LAYER (shared live DB, with localStorage fallback) ---------------- */
const DB_KEY='kzr_db_v1', CART_KEY='kzr_cart_v1';
let dbRef=null, firebaseReady=false;

function seed(){
  return {
    settings:{
      brand:'KAZERA', tagline:'Wear the silence.',
      whatsapp:'918099981296',
      waTemplate:'Hi KAZERA! I would like to place an order.\n\nOrder ID: {orderId}\n{items}\nSubtotal: ₹{subtotal}\nCoupon: {coupon}\nDiscount: -₹{discount}\nTotal Payable: ₹{total}\nPayment Mode: {payment}\n\nName: {name}\nPhone: {phone}\nAddress: {address}\nLandmark: {landmark}\nCity: {city}\nDistrict: {district}\nState: {state}\nPincode: {pincode}',
      announcement:'FREE SHIPPING ON ORDERS ABOVE ₹1999 — NEW DROP LIVE NOW — USE CODE KAZERA10 FOR 10% OFF',
      popup:{enabled:true,title:'10% OFF YOUR FIRST ORDER',text:'Use code KAZERA10 at checkout on WhatsApp.'},
      coupons:[{code:'KAZERA10',desc:'10% off on your first order',active:true,type:'percent',value:10,minOrder:0},{code:'FEST200',desc:'Flat ₹200 off above ₹1999',active:true,type:'flat',value:200,minOrder:1999}],
      codEnabled:true,
      festival:{enabled:true,title:'FESTIVAL SALE',text:'Up to 40% off — limited stock, ends soon.'},
      limited:{enabled:true,title:'LIMITED DROP',text:'Only 48 hours left on selected styles.'},
      nav:['Home','New Drop','Shop','Track Order','About','FAQ','Contact'],
      about:'KAZERA is a minimalist streetwear label built for people who let silence speak louder than logos. Every piece is designed in-house and made from heavyweight cotton, cut for a considered, oversized fit.',
      faq:[{q:'What sizes do you offer?',a:'We offer S to XXL across all core styles.'},{q:'How long does delivery take?',a:'3–7 business days across India.'},{q:'How do I place an order?',a:'Add items to cart, checkout, and confirm via WhatsApp.'},{q:'What is your return policy?',a:'Unused items can be exchanged within 7 days of delivery.'}],
      contact:{phone:'+91 8099981296',email:'hello@kazera.in',address:'Guwahati, Assam, India'},
      social:{instagram:'https://instagram.com/kazera',facebook:'',twitter:''},
      maintenance:false,
      maintenanceMsg:'KAZERA is currently undergoing scheduled maintenance. We will be back shortly.',
      adminPass:'kazera123'
    },
    products:[
      {id:'p1',name:'Void Oversized Tee',price:1499,mrp:1999,category:'new',sizes:['S','M','L','XL'],colors:['Black','Charcoal'],stock:24,desc:'Heavyweight 260GSM cotton oversized tee with dropped shoulders.',images:['','','','']},
      {id:'p2',name:'Ash Boxy Tee',price:1299,mrp:1699,category:'bestseller',sizes:['S','M','L','XL','XXL'],colors:['White','Charcoal'],stock:40,desc:'Boxy fit essential tee in brushed cotton.',images:['','','','']},
      {id:'p3',name:'Monochrome Graphic Tee',price:1599,mrp:2099,category:'featured',sizes:['M','L','XL'],colors:['Black'],stock:15,desc:'Minimal front print, garment-dyed for a worn-in look.',images:['','','','']},
      {id:'p4',name:'Shadow Crewneck Tee',price:1399,mrp:1799,category:'new',sizes:['S','M','L'],colors:['Black','White'],stock:30,desc:'Clean crewneck silhouette with reinforced seams.',images:['','','','']}
    ],
    orders:[], reviews:[]
  };
}
function loadCart(){return JSON.parse(localStorage.getItem(CART_KEY)||'[]');}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartCount();}
function updateWishCount(){const e=document.getElementById('wishCount');if(!e)return;const n=wishList().filter(id=>db&&db.products.some(p=>p.id===id)).length;e.textContent=n;e.style.display=n?'flex':'none';}
function updateCartCount(){document.getElementById('cartCount').textContent=loadCart().reduce((a,i)=>a+i.qty,0);}

let db=null;

/* Fills in newer fields (festival banner, order tracking, Track Order menu) on data that already exists in Firebase.
   Does not touch the Firebase connection. */
function normalizeDB(d){
  if(!d)return d;
  d.settings=d.settings||seed().settings;
  d.settings.festival=Object.assign({enabled:false,title:'FESTIVAL SALE',text:'Special festival offers on selected styles.',kicker:'KAZERA FESTIVE SPECIAL',button:'SHOP THE OFFER',code:'',start:'',end:''},d.settings.festival||{});
  d.settings.shopBanner=Object.assign({enabled:true,kicker:'TRIBUTE TO',title:'ZUBEEN GARG',subtitle:'HIS MUSIC LIVES FOREVER',signature:'Zubeen Garg',side:'Legend Never Fades',tagline:'Wear the Legend',image:'',quote:''},d.settings.shopBanner||{});
  d.orders=(d.orders||[]).map(o=>Object.assign({trackingNumber:'',courier:'',trackingUrl:'',trackingNote:'',shippedAt:'',deliveredAt:'',confirmedAt:'',outForDeliveryAt:'',cancelledAt:''},o));
  if(Array.isArray(d.settings.nav)&&!d.settings.nav.includes('Track Order')){
    const i=d.settings.nav.indexOf('Shop');
    d.settings.nav.splice(i>=0?i+1:d.settings.nav.length,0,'Track Order');
  }
  return d;
}

/* copy of the data WITHOUT the admin password, so it is never stored in the public database */
function pub(d){ const c=JSON.parse(JSON.stringify(d)); if(c.settings) delete c.settings.adminPass; return c; }

function saveDB(d){
  db=d;
  if(firebaseReady){ dbRef.set(pub(d)).catch(err=>console.error('KAZERA: live sync failed —',err)); }
  else{ localStorage.setItem(DB_KEY,JSON.stringify(d)); }
}

function localFallback(reason){
  console.warn('KAZERA: running in OFFLINE mode — admin changes will only show on this device. Reason: '+(reason||'firebaseConfig is empty')+'. Check Firebase Realtime Database rules and databaseURL.');
  let d=localStorage.getItem(DB_KEY);
  if(d){ db=JSON.parse(d); } else { db=seed(); localStorage.setItem(DB_KEY,JSON.stringify(db)); }
  route();
}

function initData(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey==='YOUR_API_KEY'){ localFallback(); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    dbRef=firebase.database().ref('kzr_db_v1');
    dbRef.once('value').then(snap=>{
      if(snap.exists()){ db=snap.val(); dbRef.child('settings/adminPass').remove().catch(()=>{}); } else { db=seed(); dbRef.set(pub(db)); }
      if(db.settings) delete db.settings.adminPass;
      firebaseReady=true;
      route();
      /* keep every open tab/device in sync — this is the "live edit" part */
      dbRef.on('value',snap2=>{ if(snap2.exists()){ db=snap2.val(); if(db.settings) delete db.settings.adminPass; route(); } });
    }).catch(err=>{ console.error('KAZERA: Firebase read failed —',err); localFallback(err&&err.message?err.message:String(err)); });
  }catch(err){
    console.error('KAZERA: Firebase init failed —',err);
    localFallback(err&&err.message?err.message:String(err));
  }
}

/* ---------------- CHROME (header/nav/footer/announce/popup) ---------------- */
function renderChrome(){
  document.getElementById('logoText').textContent=db.settings.brand;
  const soc=db.settings.social||{};
  const socIc=[['instagram',IC.ig],['facebook',IC.fb],['twitter',IC.x]].filter(a=>soc[a[0]]).map(a=>`<a href="${esc(soc[a[0]])}" target="_blank" rel="noopener" aria-label="${a[0]}">${a[1]}</a>`).join('');
  document.getElementById('announce').innerHTML='<div class="ann-scroll"><span>'+db.settings.announcement+' &nbsp;&nbsp;•&nbsp;&nbsp; '+db.settings.announcement+'</span></div>'+(socIc?`<div class="ann-soc"><em>Follow Us :</em>${socIc}</div>`:'');
  const navLinks={'Home':'#/','New Drop':'#/shop?cat=new','Shop':'#/shop','About':'#/about','FAQ':'#/faq','Contact':'#/contact','Track Order':'#/account'};
  const cur=location.hash||'#/';
  const isAct=h=>h==='#/'?(cur==='#/'||cur===''||cur==='#'):h.includes('?')?cur===h:((cur===h||cur.startsWith(h+'?')||cur.startsWith(h+'/'))&&!(h==='#/shop'&&cur.includes('cat=')));
  const navHtml=db.settings.nav.map(n=>{const h=navLinks[n]||'#/';return `<a href="${h}" class="${isAct(h)?'active':''}">${n}</a>`;}).join('');
  document.getElementById('mainNav').innerHTML=navHtml;
  document.getElementById('mobileNav').innerHTML=db.settings.nav.map(n=>`<a href="${navLinks[n]||'#/'}" onclick="toggleMobileNav()">${n}</a>`).join('');
  const bn=db.settings.shopBanner||{};
  const fsoc=[['instagram',IC.ig],['facebook',IC.fb],['twitter',IC.x]].filter(a=>soc[a[0]]).map(a=>`<a href="${esc(soc[a[0]])}" target="_blank" rel="noopener" aria-label="${a[0]}">${a[1]}</a>`).join('')+(db.settings.whatsapp?`<a href="https://wa.me/${esc(db.settings.whatsapp)}" target="_blank" rel="noopener" aria-label="WhatsApp">${IC.wa}</a>`:'');

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseHash(){
  const h=location.hash.slice(2)||'';
  const [path,qs]=h.split('?');
  const parts=path.split('/').filter(Boolean);
  const params={};(qs||'').split('&').forEach(p=>{if(!p)return;const [k,v]=p.split('=');params[k]=decodeURIComponent(v||'');});
  return {parts,params};
}

function route(){
  if(!db)return; /* data still loading */
  normalizeDB(db);
  if(db.settings.maintenance && !location.hash.startsWith('#/admin')){
    document.querySelector('header').classList.add('hide');
    document.getElementById('app').innerHTML=`<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div><h1 style="font-size:34px;text-transform:uppercase">We'll be right back</h1><p style="color:var(--muted);margin-top:12px;max-width:420px">${esc(db.settings.maintenanceMsg)}</p></div></div>`;
    document.querySelector('footer').classList.add('hide');document.getElementById('wa-float').classList.add('hide');document.getElementById('announce').classList.add('hide');
    return;
  }
  document.querySelector('header').classList.remove('hide');document.querySelector('footer').classList.remove('hide');document.getElementById('wa-float').classList.remove('hide');document.getElementById('announce').classList.remove('hide');
  renderChrome();
  updateWishCount();
  const {parts,params}=parseHash();
  const p0=parts[0]||'';
  if(p0==='admin'){renderAdmin(parts,params);return;}
  document.getElementById('app').style.display='block';
  if(p0===''||p0==='home')renderHome();
  else if(p0==='shop')renderShop(params);
  else if(p0==='product')renderProduct(parts[1]);
  else if(p0==='cart')renderCart();
  else if(p0==='wishlist')renderWishlist();
  else if(p0==='checkout')renderCheckout();
  else if(p0==='account'||p0==='track')renderAccount();
  else if(p0==='order')renderOrderDetail(parts[1]);
  else if(p0==='about')renderAbout();
  else if(p0==='faq')renderFAQ();
  else if(p0==='contact')renderContact();
  else document.getElementById('app').innerHTML='<div class="wrap section">Page not found.</div>';
  window.scrollTo(0,0);
}

function setOpt(k,v){pdState[k]=v;document.querySelectorAll(k==='size'?'#sizeRow button':'#colorRow button').forEach(b=>b.classList.toggle('active',b.textContent===v));}
function qtyChange(d){pdState.qty=Math.max(1,pdState.qty+d);document.getElementById('qtyVal').textContent=pdState.qty;}
function setPdImg(id,i){
  const p=db.products.find(x=>x.id===id);
  const imgs=((p.images&&p.images.some(x=>x))?p.images:(p.img?[p.img]:[])).filter(x=>x);

  document.getElementById('pdMainImg').innerHTML=`<img src="${imgs[i]}">`;
  document.querySelectorAll('[data-thumb-idx]').forEach(el=>{el.style.borderColor=(+el.dataset.thumbIdx===i)?'var(--white)':'var(--line)';});
}
function shareProduct(id){
  const p=db.products.find(x=>x.id===id);
  const url=location.origin+location.pathname+'#/product/'+id;
  const text=`Check out ${p.name} on ${db.settings.brand} — ₹${p.price}`;
  if(navigator.share){
    navigator.share({title:p.name,text,url}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>alert('Product link copied to clipboard!')).catch(()=>openWhatsApp(text+' '+url));
  }else{
    openWhatsApp(text+' '+url);
  }
}
function addToCart(id){
  const p=db.products.find(x=>x.id===id);const cart=loadCart();
  const key=id+pdState.size+pdState.color;
  const existing=cart.find(i=>i.key===key);
  if(existing)existing.qty+=pdState.qty;
  else cart.push({key,id,name:p.name,price:p.price,size:pdState.size,color:pdState.color,qty:pdState.qty});
  saveCart(cart);
  closeQuickAdd();
  location.hash='#/cart';
  window.scrollTo(0,0);
}

function setPayment(mode){
  ckState.payment=mode;
  document.getElementById('payCodBtn').classList.toggle('active',mode==='cod');
  document.getElementById('payWaBtn').classList.toggle('active',mode==='online');
}
function applyCoupon(subtotal){
  const msgEl=document.getElementById('ckCouponMsg');
  const code=document.getElementById('ckCoupon').value.trim().toUpperCase();
  if(!code){ckState.coupon=null;ckState.discount=0;msgEl.textContent='';msgEl.style.color='var(--muted)';updateCkTotals(subtotal);return;}
  const coupon=db.settings.coupons.find(c=>c.active&&c.code.toUpperCase()===code);
  if(!coupon){ckState.coupon=null;ckState.discount=0;msgEl.textContent='Invalid or inactive coupon code.';msgEl.style.color='#ff8080';updateCkTotals(subtotal);return;}
  if(coupon.minOrder&&subtotal<coupon.minOrder){ckState.coupon=null;ckState.discount=0;msgEl.textContent=`This coupon needs a minimum order of ₹${coupon.minOrder}.`;msgEl.style.color='#ff8080';updateCkTotals(subtotal);return;}
  let discount=coupon.type==='percent'?Math.round(subtotal*(coupon.value||0)/100):(coupon.value||0);
  discount=Math.min(discount,subtotal);
  ckState.coupon=coupon;ckState.discount=discount;
  msgEl.textContent=`✓ "${coupon.code}" applied — you saved ₹${discount}.`;msgEl.style.color='#7dffa0';
  updateCkTotals(subtotal);
}
function updateCkTotals(subtotal){
  document.getElementById('ckDiscountVal').textContent='−₹'+ckState.discount;
  document.getElementById('ckTotalVal').textContent='₹'+Math.max(0,subtotal-ckState.discount);
}
function placeOrder(subtotal){
  const name=document.getElementById('ckName').value.trim();
  const phone=document.getElementById('ckPhone').value.trim();
  const addr=document.getElementById('ckAddr').value.trim();
  const landmark=document.getElementById('ckLandmark').value.trim();
  const pincode=document.getElementById('ckPincode').value.trim();
  const city=document.getElementById('ckCity').value.trim();
  const district=document.getElementById('ckDistrict').value.trim();
  const state=document.getElementById('ckState').value.trim();
  if(!name||!phone||!addr||!city||!state||!pincode){alert('Please fill in Name, Phone, Address, City, State and Pincode.');return;}
  if(!/^[0-9]{6}$/.test(pincode)){alert('Please enter a valid 6-digit pincode.');return;}
  if(ckState.payment==='cod'&&db.settings.codEnabled===false){alert('Cash on Delivery is currently unavailable. Please choose Pay via WhatsApp.');return;}
  const cart=loadCart();
  const discount=ckState.discount||0;
  const total=Math.max(0,subtotal-discount);
  const orderId='KZ'+Date.now().toString().slice(-8);
  const itemsText=cart.map(i=>`- ${i.name} | Size: ${i.size} | Colour: ${i.color} | Qty: ${i.qty} | Price: ₹${i.price*i.qty}`).join('\n');
  const fullAddress=`${addr}, ${landmark?landmark+', ':''}${city}, ${district?district+', ':''}${state} - ${pincode}`;
  const msg=db.settings.waTemplate
    .replace('{orderId}',orderId).replace('{items}',itemsText)
    .replace('{subtotal}',subtotal).replace('{coupon}',ckState.coupon?ckState.coupon.code:'None').replace('{discount}',discount).replace('{total}',total)
    .replace('{payment}',ckState.payment==='cod'?'Cash on Delivery':'Pay via WhatsApp')
    .replace('{name}',name).replace('{phone}',phone).replace('{address}',addr)
    .replace('{landmark}',landmark||'-').replace('{city}',city).replace('{district}',district||'-').replace('{state}',state).replace('{pincode}',pincode);
  db.orders.push({id:orderId,items:cart,subtotal,discount,coupon:ckState.coupon?ckState.coupon.code:'',total,payment:ckState.payment,
    name,phone,address:fullAddress,addrDetail:{line:addr,landmark,city,district,state,pincode},status:'Pending',courier:'',trackingNumber:'',trackingUrl:'',trackingNote:'',shippedAt:'',deliveredAt:'',confirmedAt:'',outForDeliveryAt:'',cancelledAt:'',date:new Date().toISOString()});
  saveDB(db);
  localStorage.setItem('kzr_last_phone',phone);
  saveCart([]);
  openWhatsApp(msg);
  location.hash='#/order/'+orderId;
}

function renderTrackingBlock(o){
  const stages=['Pending','Confirmed','Shipped','Delivered'];
  const current=stages.indexOf(o.status);
  const steps=stages.map((s,i)=>`<div class="tracking-step ${i<=current?'done':''}">${s}</div>`).join('');
  const trackingNo=o.trackingNumber?`<div>Tracking/AWB: <strong>${esc(o.trackingNumber)}</strong></div>`:'';
  const carrier=o.courier?`<div>Courier: <strong>${esc(o.courier)}</strong></div>`:'';
  const url=o.trackingUrl&&/^https?:\/\//i.test(o.trackingUrl)?`<a class="track-link" href="${esc(o.trackingUrl)}" target="_blank" rel="noopener">Track shipment with courier ↗</a>`:'';
  const note=o.trackingNote?`<div>${esc(o.trackingNote)}</div>`:'';
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px"><strong style="font-size:12px;text-transform:uppercase;letter-spacing:.06em">Order tracking</strong><div class="tracking-steps">${steps}</div><div class="track-meta">${carrier}${trackingNo}${o.shippedAt?`<div>Shipped: ${new Date(o.shippedAt).toLocaleDateString()}</div>`:''}${o.deliveredAt?`<div>Delivered: ${new Date(o.deliveredAt).toLocaleDateString()}</div>`:''}${note}</div>${url}</div>`;
}
function lookupOrders(){
  const phone=document.getElementById('lookupPhone').value.trim();
  const list=db.orders.filter(o=>o.phone===phone).reverse();
  document.getElementById('orderList').innerHTML=list.length?list.map(o=>`

      <div style="font-size:12px;color:var(--muted);margin:6px 0">${new Date(o.date).toLocaleDateString()} · ₹${o.total}</div>
      <div style="font-size:13px">${o.items.map(i=>`${esc(i.name)} (${i.size}/${i.color}) x${i.qty}`).join(', ')}</div>
      ${renderTrackingBlock(o)}
      <button class="small-btn" style="margin-top:10px;margin-right:8px" onclick="location.hash='#/order/${o.id}'">View Details</button>
      ${o.status==='Delivered'?`<button class="small-btn" style="margin-top:10px" onclick="openReviewForm('${o.items[0].id}')">Write a Review</button>`:''}

function canCancel(o){return ['Pending','Confirmed','Processing'].includes(o.status)&&(Date.now()-new Date(o.date).getTime())<86400000;}
function renderOrderDetail(id){

  const idxMap={Pending:0,Confirmed:1,Processing:1,Shipped:2,'Out for Delivery':3,Delivered:4};
  const cancelled=o.status==='Cancelled';
  const cur=cancelled?0:(idxMap[o.status]!==undefined?idxMap[o.status]:0);
  const stages=[
    {n:'Order Placed',t:o.date,ic:IC.receipt},
    {n:'Order Confirmed',t:o.confirmedAt,ic:IC.ok},

  const ad=o.addrDetail||{};
  const addr=o.address||[ad.line,ad.landmark,ad.city,ad.district,ad.state].filter(Boolean).join(', ')+(ad.pincode?' - '+ad.pincode:'');
  const b=db.settings.shopBanner||{};

        <button class="od-qa" onclick="returnRequest('${o.id}')"><span class="ci">${IC.refresh}</span><span><b>Return / Exchange</b><small>Request on WhatsApp</small></span><span class="ar">${IC.chev}</span></button></div>

function odUnlock(id){
  const o=db.orders.find(x=>x.id===id);const v=(document.getElementById('odPhone').value||'').trim();
  if(o&&v&&v===o.phone){sessionStorage.setItem('kzr_od_'+id,'1');renderOrderDetail(id);}else alert('This phone number does not match the order.');
}
function copyOrderId(id,btn){
  const done=()=>{if(btn){btn.style.color='#2ecc71';setTimeout(()=>btn.style.color='',1200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(id).then(done,()=>prompt('Copy your order ID:',id));}
  else prompt('Copy your order ID:',id);
}
function odTrack(id){
  const o=db.orders.find(x=>x.id===id);
  if(o&&o.trackingUrl&&/^https?:\/\//i.test(o.trackingUrl)){window.open(o.trackingUrl,'_blank','noopener');return;}
  const el=document.getElementById('odStatus');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
}
function cancelOrder(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  if(o.status==='Cancelled'){alert('This order is already cancelled.');return;}
  if(!canCancel(o)){alert('Orders can be cancelled only within 24 hours of placing them, and before they are shipped. Please contact us on WhatsApp for help.');return;}
  if(!confirm('Cancel order #'+o.id+'? This cannot be undone.'))return;
  o.status='Cancelled';o.cancelledAt=new Date().toISOString();
  saveDB(db);renderOrderDetail(id);
  openWhatsApp('Hi '+db.settings.brand+', I have cancelled my order #'+o.id+'.');
}
function returnRequest(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  if(o.status!=='Delivered'){alert('Return / Exchange can be requested after your order is delivered. For any other help, use Live Chat.');return;}
  openWhatsApp('Hi '+db.settings.brand+', I would like to request a return / exchange for order #'+o.id+'.');
}
function downloadInvoice(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const w=window.open('','_blank');
  if(!w){alert('Please allow pop-ups for this site to download the invoice.');return;}
  const rows=(o.items||[]).map(i=>`<tr><td>${esc(i.name)}<br><small>Size ${esc(i.size)} / ${esc(i.color)}</small></td><td style="text-align:center">${i.qty}</td><td style="text-align:right">₹${i.price}</td><td style="text-align:right">₹${i.price*i.qty}</td></tr>`).join('');
  const sub=o.subtotal!==undefined?o.subtotal:(o.items||[]).reduce((a,i)=>a+i.price*i.qty,0);
  const c=db.settings.contact||{};
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Invoice ${esc(o.id)}</title><style>
    body{font-family:Arial,sans-serif;color:#111;max-width:760px;margin:30px auto;padding:0 20px}
    h1{margin:0;font-size:28px}table{width:100%;border-collapse:collapse;margin-top:22px}
    th,td{border-bottom:1px solid #ddd;padding:10px 6px;font-size:13px;text-align:left}th{background:#f4f4f4}
    .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}.t{font-weight:800;font-size:16px;border-top:2px solid #111;margin-top:6px;padding-top:10px}
    .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}small{color:#666}
    </style></head><body>
    <div class="top"><div><h1>${esc(db.settings.brand)}</h1><small>${esc(c.address||'')}<br>${esc(c.phone||'')} ${esc(c.email||'')}</small></div>
    <div style="text-align:right"><b>INVOICE</b><br>Order #${esc(o.id)}<br>${fmtD(o.date)}<br><small>${o.payment==='cod'?'Cash on Delivery':'Pay via WhatsApp'}</small></div></div>
    <p style="margin-top:22px;font-size:13px"><b>Bill to</b><br>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address||'')}</p>
    <table><tr><th>Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Amount</th></tr>${rows}</table>
    <div style="max-width:300px;margin-left:auto;margin-top:16px"><div class="r"><span>Subtotal</span><span>₹${sub}</span></div>
    ${o.discount?`<div class="r"><span>Discount${o.coupon?' ('+esc(o.coupon)+')':''}</span><span>- ₹${o.discount}</span></div>`:''}
    <div class="r t"><span>Total</span><span>₹${o.total}</span></div></div>
    <p style="margin-top:40px;font-size:12px;color:#666;text-align:center">Thank you for shopping with ${esc(db.settings.brand)}.</p>
    </body></html>`);
  w.document.close();
  setTimeout(()=>{try{w.focus();w.print();}catch(e){}},400);
}

function openReviewForm(productId){
  const p=db.products.find(x=>x.id===productId);
  document.getElementById('orderList').innerHTML+=`<div class="admin-card">
    <h3 style="margin-bottom:10px">Review: ${esc(p?p.name:'')}</h3>
    <div class="form-field"><label>Your Name</label><input id="rvName"></div>
    <div class="form-field"><label>Rating (1-5)</label><input id="rvRating" type="number" min="1" max="5" value="5"></div>
    <div class="form-field"><label>Review</label><textarea id="rvText"></textarea></div>
    <div class="form-field"><label>Product Photo</label><input id="rvPhoto" type="file" accept="image/*"></div>
    <div class="form-field"><label>Product Video</label><input id="rvVideo" type="file" accept="video/*"></div>
    <button class="btn btn-solid" onclick="submitReview('${productId}')">Submit Review</button>
  </div>`;
}
function submitReview(productId){
  const name=document.getElementById('rvName').value.trim()||'Anonymous';
  const rating=Math.min(5,Math.max(1,parseInt(document.getElementById('rvRating').value)||5));
  const text=document.getElementById('rvText').value.trim();
  const photoFile=document.getElementById('rvPhoto').files[0];
  const videoFile=document.getElementById('rvVideo').files[0];
  const finish=(photo,video)=>{
    db.reviews.push({id:'r'+Date.now(),productId,name,rating,text,photo:photo||'',video:video||'',approved:false});
    saveDB(db);
    alert('Thank you! Your review is submitted and will appear once approved.');
    location.hash='#/account';
  };
  const reads=[];
  if(photoFile)reads.push(new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(photoFile);}));
  if(videoFile)reads.push(new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(videoFile);}));
  if(!reads.length)return finish('','');
  Promise.all(reads).then(vals=>finish(photoFile?vals[0]:'', photoFile?vals[1]:vals[0]));
}

function adminLogin(){
  const pw=document.getElementById('adminPw').value;
  if(firebaseReady){
    const em=(document.getElementById('adminEmail').value||'').trim();
    firebase.auth().signInWithEmailAndPassword(em,pw)
      .then(()=>{sessionStorage.setItem('kzr_admin_ok','1');renderAdmin();})
      .catch(()=>alert('Incorrect email or password'));
    return;
  }
  /* offline mode only: local password on this device */
  if(pw===db.settings.adminPass){sessionStorage.setItem('kzr_admin_ok','1');renderAdmin();}
  else alert('Incorrect password');
}

        </div>
      </div>
    </div>

function updProd(id,k,v){const p=db.products.find(x=>x.id===id);p[k]=v;saveDB(db);}
function updProdImage(id,idx,val){
  const p=db.products.find(x=>x.id===id);
  if(!p.images)p.images=['','','',''];
  while(p.images.length<4)p.images.push('');
  p.images[idx]=val;
  saveDB(db);
}
function handleProductImage(event,id,idx){
  const file=event.target.files[0];
  if(!file)return;
  const statusEl=document.getElementById('upload-status-'+id);
  if(!file.type.startsWith('image/')){if(statusEl)statusEl.textContent='Please choose an image file.';return;}
  if(statusEl)statusEl.textContent='Uploading...';
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=900;
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.82);
      try{
        updProdImage(id,idx,dataUrl);
        renderAdminTab();
      }catch(err){
        if(statusEl)statusEl.textContent='Image too large to save. Try a smaller photo.';
      }
    };
    img.onerror=function(){if(statusEl)statusEl.textContent='Could not read image. Try another file.';};
    img.src=e.target.result;
  };
  reader.onerror=function(){if(statusEl)statusEl.textContent='Upload failed. Try again.';};
  reader.readAsDataURL(file);
}

function stampOrder(o,status){
  const now=new Date().toISOString();
  if(status==='Confirmed'||status==='Processing')o.confirmedAt=o.confirmedAt||now;
  if(status==='Shipped')o.shippedAt=o.shippedAt||now;
  if(status==='Out for Delivery'){o.shippedAt=o.shippedAt||now;o.outForDeliveryAt=o.outForDeliveryAt||now;}
  if(status==='Delivered')o.deliveredAt=o.deliveredAt||now;
  if(status==='Cancelled')o.cancelledAt=o.cancelledAt||now;
}
function saveOrderTracking(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const status=document.getElementById('ord-status-'+id).value;
  o.status=status;
  o.courier=document.getElementById('ord-courier-'+id).value.trim();
  o.trackingNumber=document.getElementById('ord-awb-'+id).value.trim();
  o.trackingUrl=document.getElementById('ord-url-'+id).value.trim();
  o.trackingNote=document.getElementById('ord-note-'+id).value.trim();
  stampOrder(o,status);
  saveDB(db);renderAdminTab();alert('Order tracking updated.');
}

function handleBannerImage(e){

    const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);
    updSetting('shopBanner.image',c.toDataURL('image/jpeg',0.75));renderAdminTab();
  };im.src=rd.result;};
  rd.readAsDataURL(f);
}
