<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAZERA</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("kzr_theme")||"noir")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a;--white:#fafafa;--charcoal:#232323;--line:#3a3a3a;--muted:#9a9a9a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;letter-spacing:-0.03em;line-height:1.02}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

/* announcement */
#announce{background:var(--white);color:var(--black);text-align:center;font-size:12px;font-weight:700;letter-spacing:.04em;padding:8px 12px;overflow:hidden;white-space:nowrap}
#announce span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:16px}
.logo{font-size:24px;font-weight:900;letter-spacing:-0.04em}
nav.main{display:flex;gap:26px;font-size:13px;font-weight:700;letter-spacing:.03em}
nav.main a{opacity:.85;padding-bottom:2px;border-bottom:1px solid transparent}
nav.main a:hover{opacity:1;border-color:var(--white)}
.navicons{display:flex;align-items:center;gap:16px;font-size:19px}
.navicons button{background:none;border:none;color:var(--white);position:relative}
#cartCount{position:absolute;top:-6px;right:-8px;background:var(--white);color:var(--black);font-size:10px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center}
#menuBtn{display:none;background:none;border:none;color:var(--white);font-size:22px}
#searchBox{display:none;padding:10px 20px;border-bottom:1px solid var(--line)}
#searchBox input{width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--white);padding:10px 12px;font-size:14px}

/* hero */
.hero{position:relative;padding:90px 20px 70px;text-align:center;border-bottom:1px solid var(--line);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(42px,9vw,96px);text-transform:uppercase}
.hero p{color:var(--muted);max-width:480px;margin:18px auto 30px;font-size:15px}
.btn{display:inline-block;padding:14px 30px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--white);transition:transform .25s ease,background .25s ease,color .25s ease}
.btn-solid{background:var(--white);color:var(--black)}
.btn-solid:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--white)}
.btn-outline:hover{background:var(--white);color:var(--black)}

/* sections */
.section{padding:64px 20px;border-bottom:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:16px}
.section-head h2{font-size:clamp(26px,4vw,38px);text-transform:uppercase}
.section-head a{font-size:12px;font-weight:800;letter-spacing:.05em;border-bottom:1px solid var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--charcoal);border:1px solid var(--line);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:#666}
.card .imgbox{aspect-ratio:4/5;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.card .imgbox img{width:100%;height:100%;object-fit:cover}
.card .info{padding:14px}
.card .info h3{font-size:14px;text-transform:none;letter-spacing:0;font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--white);color:var(--black);padding:3px 7px;margin-bottom:8px}
.price-row{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:14px}
.mrp{color:var(--muted);text-decoration:line-through;font-size:12px}

/* offer strips */
.offer{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;background:var(--charcoal);border:1px dashed var(--line);padding:22px 26px;margin-bottom:16px}
.offer h3{font-size:18px;text-transform:uppercase}
.offer p{color:var(--muted);font-size:13px;margin-top:4px}
.code{font-family:monospace;background:var(--black);border:1px solid var(--line);padding:8px 14px;font-weight:800;letter-spacing:.05em}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.filters button{background:transparent;border:1px solid var(--line);color:var(--white);padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.filters button.active{background:var(--white);color:var(--black);border-color:var(--white)}

/* product detail */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.pd .imgbox{aspect-ratio:4/5;background:#1a1a1a}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.opt-row button{border:1px solid var(--line);background:transparent;color:var(--white);padding:8px 14px;font-size:12px;font-weight:700}
.opt-row button.active{background:var(--white);color:var(--black)}
.qty{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.qty button{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--white);font-size:16px}
.review{border-top:1px solid var(--line);padding:16px 0}
.stars{color:#f4c542;font-size:14px;letter-spacing:2px}
.review img,.review video{max-width:160px;margin-top:8px}

/* forms */
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.form-field input,.form-field textarea,.form-field select{width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--white);padding:12px;font-size:14px;font-family:inherit}
.form-field textarea{resize:vertical;min-height:80px}

/* cart */
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}
.cart-line .meta{font-size:12px;color:var(--muted)}

/* popup */
#popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#popup-box{background:var(--white);color:var(--black);max-width:380px;width:100%;padding:36px 28px;text-align:center;position:relative}
#popup-box button.close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;color:var(--black)}

/* whatsapp float */
#wa-float{position:fixed;bottom:24px;right:20px;z-index:80;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.4);border:none}

footer{padding:40px 20px 30px;text-align:center;color:var(--muted);font-size:12px}
footer .flinks{display:flex;justify-content:center;gap:18px;margin-bottom:14px;font-weight:700}

/* admin */
.admin-wrap{display:flex;min-height:100vh}
.admin-side{width:210px;background:var(--charcoal);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0}
.admin-side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--white);padding:12px 20px;font-size:13px;font-weight:700}
.admin-side button.active{background:var(--white);color:var(--black)}
.admin-main{flex:1;padding:28px;overflow-x:auto}
.admin-main h2{font-size:24px;margin-bottom:20px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{border-bottom:1px solid var(--line);padding:10px;text-align:left}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.stat-card{background:var(--charcoal);border:1px solid var(--line);padding:18px}
.stat-card .num{font-size:26px;font-weight:800}
.stat-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.admin-card{background:var(--charcoal);border:1px solid var(--line);padding:18px;margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small-btn{border:1px solid var(--line);background:transparent;color:var(--white);padding:6px 12px;font-size:11px;font-weight:700}
.badge{padding:3px 8px;font-size:10px;font-weight:800;text-transform:uppercase}
.badge.Pending{background:#5a4a1a;color:#ffd66b}
.badge.Confirmed{background:#1a3a5a;color:#7ec8ff}
.badge.Shipped{background:#3a2a5a;color:#c7a3ff}
.badge.Delivered{background:#1a5a2a;color:#7dffa0}

@media(max-width:860px){
  nav.main{display:none}
  #menuBtn{display:block}
  .pd{grid-template-columns:1fr}
  .admin-wrap{flex-direction:column}
  .admin-side{width:100%;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .admin-side button{white-space:nowrap}
  .row2{grid-template-columns:1fr}
}
#mobileNav{display:none;flex-direction:column;background:var(--black);border-bottom:1px solid var(--line);padding:10px 20px}
#mobileNav a{padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}

/* KAZERA enhancements: discounts, festival campaign and order tracking */
.discount-pill{display:inline-block;background:#d7ff00;color:#080808;font-size:10px;font-weight:900;letter-spacing:.04em;padding:5px 8px;margin:0 0 8px}
.savings{color:#d7ff00;font-size:12px;font-weight:800;margin-top:5px}
.festival-hero{background:linear-gradient(115deg,#4b090d,#941d27 58%,#d78a27);border:1px solid #ffffff22;padding:28px;margin:0 0 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.festival-hero h2{font-size:clamp(25px,5vw,42px);margin:8px 0;text-transform:uppercase}
.festival-hero p{color:#ffe8dc;font-size:14px;line-height:1.5}
.festival-hero .fest-kicker{font-size:11px;font-weight:900;letter-spacing:.15em}
.festival-hero .fest-code{display:inline-block;background:var(--surf);color:#fff;padding:8px 12px;font-family:monospace;font-weight:900;margin-top:12px}
.tracking-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.tracking-step{border-top:3px solid #444;padding-top:8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
.tracking-step.done{border-color:#d7ff00;color:#fff}
.track-meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;overflow-wrap:anywhere}
.track-link{display:inline-block;margin-top:10px;color:#d7ff00;text-decoration:underline;font-size:13px;font-weight:800}
.admin-track-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.admin-track-grid input,.admin-track-grid select{min-width:0;width:100%;background:var(--black);border:1px solid var(--line);color:var(--white);padding:9px;font-size:12px}
@media(max-width:600px){.festival-hero{padding:20px;align-items:flex-start}.festival-hero .fest-symbol{display:none}.tracking-steps{gap:5px}.tracking-step{font-size:9px}.admin-track-grid{grid-template-columns:1fr}}

/* ===== KAZERA shop redesign (black + yellow) ===== */
:root{--accent:#ffd21f}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#announce{background:var(--black);color:var(--accent);border-bottom:1px solid var(--line2);letter-spacing:.06em}
nav.main a.active{color:var(--accent);opacity:1;border-color:var(--accent)}
#cartCount{background:var(--accent);color:#000}
#wishCount{position:absolute;top:-6px;right:-8px;background:#e53935;color:#fff;font-size:10px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:none;align-items:center;justify-content:center}
.navicons button{display:flex}
.discount-pill{background:var(--accent);color:#000}
.savings,.track-link{color:var(--accent)}
.tracking-step.done{border-color:var(--accent)}

.shop-hero{position:relative;overflow:hidden;min-height:300px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 78% 40%,var(--line2) 0%,var(--black) 65%)}
.shop-hero .sh-text{position:relative;z-index:2;padding:34px 24px 34px max(24px,calc((100vw - 1180px)/2 + 20px));max-width:640px}
.sh-kicker{font-size:clamp(16px,3vw,26px);letter-spacing:.22em;font-weight:500}
.sh-title{font-family:'Anton','Impact','Arial Narrow',sans-serif;font-weight:400;font-style:italic;color:var(--accent);font-size:clamp(46px,9vw,92px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:6px 0 10px;transform:skewX(-6deg);transform-origin:left}
.sh-sub{display:flex;align-items:center;gap:12px;font-size:clamp(11px,1.8vw,16px);letter-spacing:.3em;color:#ddd}
.sh-sub i{display:block;height:1px;width:34px;background:#777;flex-shrink:0}
.sh-sign{font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(24px,4vw,40px);margin-top:14px;color:#f2f2f2}
.sh-img{position:absolute;right:0;top:0;bottom:0;width:58%;z-index:1}
.sh-img img{width:100%;height:100%;object-fit:cover;object-position:center 20%;-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
.sh-side{position:absolute;right:26px;top:50px;z-index:3;font-family:'Kaushan Script','Brush Script MT',cursive;font-size:clamp(16px,2.6vw,28px);line-height:1.1;transform:rotate(-8deg);color:#fff;text-align:left;text-shadow:0 2px 8px #000}
.sh-side b{color:var(--accent);font-weight:400}

.shop-pills{display:flex;gap:12px;flex-wrap:wrap;padding:22px 0 18px}
.shop-pills button{background:transparent;border:1px solid var(--line);color:var(--white);padding:11px 26px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.shop-pills button.active{background:var(--accent);border-color:var(--accent);color:#000}
.shop-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line2);margin-bottom:18px;position:relative}
.shop-bar .tb{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--white);font-size:14px;font-weight:600;padding:6px 0}
.shop-bar .tb .ico{width:18px;height:18px}
.shop-bar .sortwrap{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid #333}
.shop-bar select{background:transparent;color:var(--white);border:none;font-size:14px;font-weight:600;font-family:inherit;padding:6px 0;cursor:pointer}
.shop-bar select option{background:var(--surf);color:#fff}
.shop-bar .count{margin-left:auto;color:#cfcfcf;font-size:13px}
.shop-bar .views{display:flex;gap:4px}
.shop-bar .views button{background:none;border:none;color:#777;padding:4px;border-bottom:2px solid transparent}
.shop-bar .views button.on{color:var(--accent);border-color:var(--accent)}
.fpanel{background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:16px 18px;margin:-6px 0 18px;display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.fpanel label.ck{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.fpanel input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.fpanel .sz{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600}
.fpanel .sz button{border:1px solid var(--line);background:transparent;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700}
.fpanel .sz button.on{background:var(--accent);border-color:var(--accent);color:#000}
.fpanel .clr{margin-left:auto;background:none;border:none;color:var(--accent);font-size:12px;font-weight:800;text-decoration:underline}

.grid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
.card{background:var(--surf);border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column}
.card:hover{border-color:#5c5c5c}
.card .cimg{position:relative}
.card .imgbox{display:flex;aspect-ratio:1/1.02;background:#e6e6e8;color:#111}
.card .imgbox img{object-fit:cover}
.card .info{padding:14px 14px 16px;display:flex;flex-direction:column;flex:1}
.card .info h3{font-size:14px;line-height:1.25}
.card .sub{color:#b5b5b5;font-size:13px;margin-top:4px}
.card .rate{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#cfcfcf}
.st{position:relative;display:inline-block;color:#444;font-size:13px;line-height:1}
.st span{position:absolute;left:0;top:0;overflow:hidden;color:var(--accent);white-space:nowrap}
.card .price-row{flex-wrap:wrap;gap:6px 8px;margin-top:10px;align-items:center}
.card .price-row strong{font-size:22px;letter-spacing:-.02em}
.card .price-row .mrp{font-size:13px}
.card .price-row .discount-pill{margin:0;font-size:10px;padding:4px 7px;border-radius:3px}
.card .addbtn{margin-top:auto;width:100%;background:var(--accent);color:#000;border:none;border-radius:4px;padding:12px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px}
.card .addbtn .ico{width:18px;height:18px}
.card .addbtn:disabled{background:#333;color:#888;cursor:not-allowed}
.card .addwrap{margin-top:12px;padding-top:0}
.cbadge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--accent);color:#000;z-index:2}
.cbadge.new{background:#e53935;color:#fff}
.heart{position:absolute;top:8px;right:8px;z-index:2;background:none;border:none;color:#222;padding:4px}
.heart .ico{width:24px;height:24px}
.heart.on{color:#e53935}
.heart.on .ico{fill:#e53935}
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row}
.grid.list .card .cimg{width:170px;flex-shrink:0}
.grid.list .card .imgbox{height:100%;aspect-ratio:auto;min-height:190px}

.trust{display:flex;align-items:center;gap:28px;flex-wrap:wrap;border-top:1px solid var(--line2);padding:24px 0 6px;margin-top:34px}
.trust .ti{display:flex;align-items:center;gap:14px;padding-right:28px;border-right:1px solid var(--line2)}
.trust .ti:last-of-type{border-right:none}
.trust .ti .ico{width:34px;height:34px;color:var(--accent);flex-shrink:0}
.trust .ti b{display:block;font-size:14px}
.trust .ti span{display:block;font-size:12px;color:#aaa;margin-top:2px}
.trust .wear{margin-left:auto;font-family:'Kaushan Script','Brush Script MT',cursive;font-size:24px;color:var(--accent)}

#qa-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:220;display:flex;align-items:flex-end;justify-content:center}
#qa-box{background:var(--surf);border:1px solid var(--line2);border-radius:14px 14px 0 0;width:100%;max-width:440px;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:601px){#qa-overlay{align-items:center}#qa-box{border-radius:14px}}
#qa-box h4{font-size:16px;margin-bottom:4px}
#qa-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
#qa-box .chips{display:flex;gap:8px;flex-wrap:wrap}
#qa-box .chips button{border:1px solid var(--line);background:transparent;color:#fff;padding:9px 15px;border-radius:6px;font-size:13px;font-weight:700}
#qa-box .chips button.on{background:var(--accent);border-color:var(--accent);color:#000}

@media(max-width:860px){.sh-img{width:75%;opacity:.75}.shop-hero{min-height:240px}.shop-bar .count{margin-left:0;width:100%;order:9}}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .shop-pills{gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:16px}
  .shop-pills button{padding:10px 18px;white-space:nowrap;font-size:12px}
  .card .info{padding:11px 10px 12px}
  .card .price-row strong{font-size:18px}
  .card .addbtn{padding:11px 6px;font-size:11px}
  .sh-side{display:none}
  .trust{gap:16px}.trust .ti{border-right:none;padding-right:0;width:100%}.trust .wear{margin-left:0}

/* ===== Colour themes (controlled from Admin > Settings) ===== */
:root{--surf:#111;--line2:#2a2a2a}
html[data-theme="violet"]{--black:#0d0a17;--charcoal:#1d1830;--surf:#151024;--line:#3a3158;--line2:#2b2444;--muted:#a59cc4;--accent:#b794ff}
html[data-theme="rose"]{--black:#140b10;--charcoal:#2a1720;--surf:#1d1017;--line:#4a2e3b;--line2:#3a2230;--muted:#c4a0af;--accent:#ff8fb1}
html[data-theme="forest"]{--black:#08120e;--charcoal:#14251d;--surf:#0e1b15;--line:#2d4a3c;--line2:#21382d;--muted:#94b5a5;--accent:#6ee7a8}
html[data-theme="ocean"]{--black:#08121c;--charcoal:#12263a;--surf:#0d1c2c;--line:#2b4763;--line2:#203a52;--muted:#93b0c8;--accent:#5cc8ff}
html[data-theme="sunset"]{--black:#150d09;--charcoal:#2a1a12;--surf:#1e130d;--line:#4f3325;--line2:#3d281c;--muted:#c4a692;--accent:#ff9a57}
html[data-theme="crimson"]{--black:#130808;--charcoal:#2a1214;--surf:#1c0d0f;--line:#4d2a2d;--line2:#3b2023;--muted:#c7a2a5;--accent:#ff4d5e}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.theme-chip{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--black);border:2px solid var(--line);color:var(--white);padding:10px;border-radius:10px;text-align:left;font-size:12px}
.theme-chip.on{border-color:var(--accent)}
.theme-chip .sw{display:flex;gap:4px;width:100%;height:34px;border-radius:6px;padding:5px;border:1px solid #ffffff22}
.theme-chip .sw i{flex:1;border-radius:4px}

.admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.admin-toolbar input,.admin-toolbar select{background:var(--black);border:1px solid var(--line);color:var(--white);padding:11px 12px;font-size:13px;font-family:inherit}

.badge.Return{background:#3a2a5a;color:#c7a3ff}

#rx-box{background:var(--surf);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:460px;padding:22px;max-height:92vh;overflow-y:auto}

.pay-opt:disabled{opacity:.4;cursor:not-allowed}
.pay-strip{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:12px;font-weight:700}

/* ===== Glow checkout button ===== */
@property --glow-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
.btn-glow{position:relative;display:block;overflow:visible;isolation:isolate;border:none!important;background:var(--black,#000)!important;color:#fff!important;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s ease,box-shadow .3s ease}
.btn-glow::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-2;background:conic-gradient(from var(--glow-angle),#ff0040,#ff9500,#ffd21f,#00e676,#00b0ff,#7c4dff,#ff00d4,#ff0040);animation:glowSpin 3s linear infinite}
.btn-glow::after{content:"";position:absolute;inset:0;z-index:-1;background:#0b0b0b;transition:background .25s ease}
.btn-glow .glow-blur{position:absolute;inset:-2px;z-index:-3;border-radius:inherit;background:conic-gradient(from var(--glow-angle),#ff0040,#ff9500,#ffd21f,#00e676,#00b0ff,#7c4dff,#ff00d4,#ff0040);filter:blur(14px);opacity:.55;animation:glowSpin 3s linear infinite;transition:opacity .3s ease,filter .3s ease}
.btn-glow:hover{transform:translateY(-2px)}
.btn-glow:hover .glow-blur{opacity:.95;filter:blur(20px)}
.btn-glow:active{transform:scale(.97)}
.btn-glow.fired::after{animation:glowFlash .6s ease}
.btn-glow .glow-ripple{position:absolute;border-radius:50%;pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px;z-index:1;background:radial-gradient(circle,#fff 0%,var(--rc,#ffd21f) 40%,transparent 70%);transform:scale(0);opacity:.9;animation:glowRipple .7s ease-out forwards}
@keyframes glowSpin{to{--glow-angle:360deg}}
@keyframes glowRipple{to{transform:scale(28);opacity:0}}
@keyframes glowFlash{0%{background:#0b0b0b}30%{background:#2a2a2a}100%{background:#0b0b0b}}
</style>

/* Fills in newer fields (festival banner, order tracking, Track Order menu) on data that already exists in Firebase.
   Does not touch the Firebase connection. */
function normalizeDB(d){
  if(!d)return d;
  d.settings=d.settings||seed().settings;
  d.settings.festival=Object.assign({enabled:false,title:'FESTIVAL SALE',text:'Special festival offers on selected styles.',kicker:'KAZERA FESTIVE SPECIAL',button:'SHOP THE OFFER',code:'',start:'',end:''},d.settings.festival||{});

  d.settings.theme=d.settings.theme||'noir';
  d.returns=toArr(d.returns);d.reviews=toArr(d.reviews);
  d.orders=toArr(d.orders).map(o=>Object.assign({trackingNumber:'',courier:'',trackingUrl:'',trackingNote:'',shippedAt:'',deliveredAt:'',confirmedAt:'',outForDeliveryAt:'',cancelledAt:''},o));
  if(Array.isArray(d.settings.nav)&&!d.settings.nav.includes('Track Order')){
    const i=d.settings.nav.indexOf('Shop');
    d.settings.nav.splice(i>=0?i+1:d.settings.nav.length,0,'Track Order');
  }
  return d;
}

/* copy of the data WITHOUT the admin password, so it is never stored in the public database */
function pub(d){ const c=JSON.parse(JSON.stringify(d)); if(c.settings) delete c.settings.adminPass; return c; }

/* Only the parts that actually changed are uploaded (e.g. editing an order no longer re-uploads every photo). */
let lastKeys={};
function keyStrs(d){const c=pub(d),m={};Object.keys(c).forEach(k=>{m[k]=JSON.stringify(c[k]);});return {c:c,m:m};}
function saveDB(d){
  db=d;
  if(firebaseReady){
    const r=keyStrs(d);
    Object.keys(r.m).forEach(k=>{
      if(k==='orders'||k==='returns')return; /* written only via safeList (transactions) */
      if(r.m[k]!==lastKeys[k]){lastKeys[k]=r.m[k];dbRef.child(k).set(r.c[k]).catch(err=>console.error('KAZERA: live sync failed —',err));}
    });
  }
  else{ localStorage.setItem(DB_KEY,JSON.stringify(d)); }
}
let lastSig='';
function syncBusy(){
  const a=document.activeElement,typing=!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  if(location.hash.startsWith('#/admin'))return typing;
  return typing||location.hash.startsWith('#/checkout')||!!document.getElementById('qa-overlay')||!!document.getElementById('rx-overlay');
}

function localFallback(reason){
  console.warn('KAZERA: running in OFFLINE mode — admin changes will only show on this device. Reason: '+(reason||'firebaseConfig is empty')+'. Check Firebase Realtime Database rules and databaseURL.');
  let d=localStorage.getItem(DB_KEY);
  if(d){ db=JSON.parse(d); } else { db=seed(); localStorage.setItem(DB_KEY,JSON.stringify(db)); }
  route();
}

function initData(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey==='YOUR_API_KEY'){ localFallback(); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    dbRef=firebase.database().ref('kzr_db_v1');
    dbRef.once('value').then(snap=>{
      if(snap.exists()){ db=snap.val(); dbRef.child('settings/adminPass').remove().catch(()=>{}); } else { db=seed(); dbRef.set(pub(db)); }
      if(db.settings) delete db.settings.adminPass;
      firebaseReady=true;
      {const ks=keyStrs(db).m;lastKeys=ks;lastSig=(ks.settings||'')+(ks.products||'')+(ks.reviews||'');}
      route();
      flushPending();
      /* keep every open tab/device in sync — this is the "live edit" part */
      dbRef.on('value',snap2=>{ if(snap2.exists()){ db=snap2.val(); if(db.settings) delete db.settings.adminPass;
        const ks=keyStrs(db).m;lastKeys=ks;const sg=(ks.settings||'')+(ks.products||'')+(ks.reviews||'');const same=sg===lastSig;lastSig=sg;
        if(!location.hash.startsWith('#/admin')&&same&&!/^#\/(order|account|track)/.test(location.hash)){normalizeDB(db);return;} /* nothing visitors can see has changed */
        route(true); } });
    }).catch(err=>{ console.error('KAZERA: Firebase read failed —',err); localFallback(err&&err.message?err.message:String(err)); });
  }catch(err){
    console.error('KAZERA: Firebase init failed —',err);
    localFallback(err&&err.message?err.message:String(err));
  }
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseHash(){
  const h=location.hash.slice(2)||'';
  const [path,qs]=h.split('?');
  const parts=path.split('/').filter(Boolean);
  const params={};(qs||'').split('&').forEach(p=>{if(!p)return;const [k,v]=p.split('=');params[k]=decodeURIComponent(v||'');});
  return {parts,params};
}

function route(fromSync){
  if(!db)return; /* data still loading */
  normalizeDB(db);applyTheme();
  if(fromSync===true&&syncBusy())return; /* do not wipe what the person is typing */
  if(db.settings.maintenance && !location.hash.startsWith('#/admin')){
    document.querySelector('header').classList.add('hide');
    document.getElementById('app').innerHTML=`<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div><h1 style="font-size:34px;text-transform:uppercase">We'll be right back</h1><p style="color:var(--muted);margin-top:12px;max-width:420px">${esc(db.settings.maintenanceMsg)}</p></div></div>`;
    document.querySelector('footer').classList.add('hide');document.getElementById('wa-float').classList.add('hide');document.getElementById('announce').classList.add('hide');
    return;
  }
  document.querySelector('header').classList.remove('hide');document.querySelector('footer').classList.remove('hide');document.getElementById('wa-float').classList.remove('hide');document.getElementById('announce').classList.remove('hide');
  renderChrome();
  updateWishCount();
  const {parts,params}=parseHash();
  const p0=parts[0]||'';
  if(p0==='admin'){renderAdmin(parts,params);return;}
  if(fromSync!==true)anPage(p0);
  document.getElementById('app').style.display='block';
  if(p0===''||p0==='home')renderHome();
  else if(p0==='shop')renderShop(params);
  else if(p0==='product')renderProduct(parts[1]);
  else if(p0==='cart')renderCart();
  else if(p0==='wishlist')renderWishlist();
  else if(p0==='checkout')renderCheckout();
  else if(p0==='account'||p0==='track')renderAccount();
  else if(p0==='order')renderOrderDetail(parts[1]);
  else if(p0==='about')renderAbout();
  else if(p0==='faq')renderFAQ();
  else if(p0==='contact')renderContact();
  else document.getElementById('app').innerHTML='<div class="wrap section">Page not found.</div>';
  if(fromSync!==true)window.scrollTo(0,0);
}

function openQuickAdd(id){
  const p=db.products.find(x=>x.id===id);if(!p)return;

  pdState={size:sizes[0]||'',color:colors[0]||'',qty:1,imgIdx:0};
  closeQuickAdd();

  o.innerHTML=`<div id="qa-box"><h4>${esc(p.name)}</h4><div style="font-weight:800">₹${p.price}</div>

  document.body.appendChild(o);
}
function qaPick(k,btn){pdState[k]=btn.dataset.v;btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));}

function isFestivalActive(f){
  if(!f||!f.enabled)return false;
  const now=Date.now(),start=f.start?new Date(f.start).getTime():-Infinity,end=f.end?new Date(f.end).getTime():Infinity;
  return now>=start&&now<=end;
}

let shopState={sort:'default',view:'grid',sizes:[],stock:false,saved:false,open:false}, shopParams={};
function setShop(k,v){shopState[k]=v;drawShop();}
function toggleShopSize(z){const a=shopState.sizes,i=a.indexOf(z);if(i>=0)a.splice(i,1);else a.push(z);drawShop();}

function renderShop(params){shopParams=params||{};drawShop();}

  const params=shopParams,cat=params.cat||'',st=shopState;

    <div class="shop-pills">${cats.map(c=>`<button class="${c===cat?'active':''}" onclick="location.hash='#/shop${c?'?cat='+c:''}'">${labels[c]}</button>`).join('')}</div>
    <div class="shop-bar">
      <button class="tb" onclick="setShop('open',${!st.open})">${IC.filter}Filter${nf?` (${nf})`:''} <span style="font-size:10px">${st.open?'▲':'▼'}</span></button>
      <div class="sortwrap">${IC.sort}<select onchange="setShop('sort',this.value)" aria-label="Sort by">
        <option value="default" ${st.sort==='default'?'selected':''}>Sort by</option>
        <option value="pl" ${st.sort==='pl'?'selected':''}>Price: Low to High</option>
        <option value="ph" ${st.sort==='ph'?'selected':''}>Price: High to Low</option>

      <div class="count">Showing ${list.length} of ${db.products.length} products</div>
      <div class="views"><button class="${st.view==='grid'?'on':''}" onclick="setShop('view','grid')" aria-label="Grid view">${IC.grid}</button><button class="${st.view==='list'?'on':''}" onclick="setShop('view','list')" aria-label="List view">${IC.list}</button></div>
    </div>

function shareProduct(id){
  const p=db.products.find(x=>x.id===id);
  const url=location.origin+location.pathname+'#/product/'+id;
  const text=`Check out ${p.name} on ${db.settings.brand} — ₹${p.price}`;
  if(navigator.share){
    navigator.share({title:p.name,text,url}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>alert('Product link copied to clipboard!')).catch(()=>openWhatsApp(text+' '+url));
  }else{

function cartFx(p,r){
  try{
    if(!r||!document.body.animate||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return false;
    const cb=document.getElementById('cartCount').parentNode;
    const t=cb.getBoundingClientRect();
    const sx=r.left+r.width/2,sy=r.top+r.height/2,ex=t.left+t.width/2,ey=t.top+t.height/2,dx=ex-sx,dy=ey-sy;
    const thumb=(p.images||[]).find(x=>x)||p.img||'';
    const ring=(x,y,from,to,ms)=>{const e=document.createElement('div');e.className='atc-ring';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
      e.animate([{transform:'scale('+from+')',opacity:.9},{transform:'scale('+to+')',opacity:0}],{duration:ms,easing:'ease-out'}).onfinish=()=>e.remove();};
    ring(sx,sy,.4,2.4,480);
    const f=document.createElement('div');f.className='atc-fly';
    f.style.left=(sx-26)+'px';f.style.top=(sy-26)+'px';
    if(thumb)f.style.backgroundImage='url("'+thumb+'")';else f.textContent='👕';
    document.body.appendChild(f);
    const a=f.animate([
      {transform:'translate(0,0) scale(.5) rotate(0deg)',opacity:0,offset:0},
      {transform:'translate(0,-46px) scale(1.15) rotate(-10deg)',opacity:1,offset:.25},
      {transform:'translate('+(dx*.62)+'px,'+(dy*.5-80)+'px) scale(.8) rotate(150deg)',opacity:1,offset:.62},
      {transform:'translate('+dx+'px,'+dy+'px) scale(.15) rotate(360deg)',opacity:.5,offset:1}
    ],{duration:760,easing:'cubic-bezier(.4,.05,.55,.95)'});
    a.onfinish=()=>{f.remove();ring(ex,ey,.5,2.2,450);
      cb.animate([{transform:'scale(1)'},{transform:'scale(1.4) rotate(-14deg)'},{transform:'scale(.9) rotate(7deg)'},{transform:'scale(1)'}],{duration:480,easing:'ease-out'});};
    return true;
  }catch(e){return false;}
}
function addToCart(id,noFx){
  const p=db.products.find(x=>x.id===id);const cart=loadCart();
  let fxRect=null;try{const ev=window.event,b=ev&&ev.target&&ev.target.closest?ev.target.closest('button'):null;if(b)fxRect=b.getBoundingClientRect();}catch(e){}
  const key=id+pdState.size+pdState.color;
  const existing=cart.find(i=>i.key===key);
  if(existing)existing.qty+=pdState.qty;
  else cart.push({key,id,name:p.name,price:p.price,size:pdState.size,color:pdState.color,qty:pdState.qty});
  saveCart(cart);
  anTrack('atc');anOnce('atcu');
  closeQuickAdd();
  if(!noFx&&cartFx(p,fxRect)){setTimeout(()=>{if(location.hash!=='#/cart'){location.hash='#/cart';window.scrollTo(0,0);}},820);return;}
  location.hash='#/cart';
  window.scrollTo(0,0);
}
function buyNow(id){addToCart(id,true);location.hash='#/cart';}

/* ---------------- COD per product ---------------- */
function cartCodInfo(cart){
  const blocked=[];
  (cart||[]).forEach(i=>{const p=(db.products||[]).find(x=>x.id===i.id);if(p&&p.cod===false&&blocked.indexOf(p.name)<0)blocked.push(p.name);});
  const globalOff=db.settings.codEnabled===false;
  return {ok:!globalOff&&!blocked.length,blocked:blocked,globalOff:globalOff};
}
function codLine(p){
  const ok=db.settings.codEnabled!==false&&p.cod!==false;
  return `<div class="ship-line">${IC.cash}<span>${ok?'Cash on Delivery &amp; Online Payment (UPI / Card) both available':'Cash on Delivery not available — Online Payment only'}</span></div>`;
}

function applyCoupon(subtotal){
  const msgEl=document.getElementById('ckCouponMsg');
  const code=document.getElementById('ckCoupon').value.trim().toUpperCase();
  if(!code){ckState.coupon=null;ckState.discount=0;msgEl.textContent='';msgEl.style.color='var(--muted)';updateCkTotals(subtotal);return;}
  const coupon=db.settings.coupons.find(c=>c.active&&c.code.toUpperCase()===code);
  if(!coupon){ckState.coupon=null;ckState.discount=0;msgEl.textContent='Invalid or inactive coupon code.';msgEl.style.color='#ff8080';updateCkTotals(subtotal);return;}
  if(coupon.minOrder&&subtotal<coupon.minOrder){ckState.coupon=null;ckState.discount=0;msgEl.textContent=`This coupon needs a minimum order of ₹${coupon.minOrder}.`;msgEl.style.color='#ff8080';updateCkTotals(subtotal);return;}
  let discount=coupon.type==='percent'?Math.round(subtotal*(coupon.value||0)/100):(coupon.value||0);
  discount=Math.min(discount,subtotal);
  ckState.coupon=coupon;ckState.discount=discount;
  msgEl.textContent=`✓ "${coupon.code}" applied — you saved ₹${discount}.`;msgEl.style.color='#7dffa0';
  updateCkTotals(subtotal);
}
function updateCkTotals(subtotal){
  const pay=Math.max(0,subtotal-ckState.discount);
  const sh=calcShipping(loadCart(),pay);
  document.getElementById('ckDiscountVal').textContent='−₹'+ckState.discount;
  const row=document.getElementById('ckShipRow');
  if(row){row.style.display=sh.raw>0?'flex':'none';document.getElementById('ckShipVal').textContent=sh.amount>0?'₹'+sh.amount:'FREE';}
  document.getElementById('ckTotalVal').textContent='₹'+(pay+sh.amount);
}
function placeOrder(subtotal){
  const name=document.getElementById('ckName').value.trim();
  const phone=document.getElementById('ckPhone').value.trim();
  const addr=document.getElementById('ckAddr').value.trim();
  const landmark=document.getElementById('ckLandmark').value.trim();
  const pincode=document.getElementById('ckPincode').value.trim();
  const city=document.getElementById('ckCity').value.trim();
  const district=document.getElementById('ckDistrict').value.trim();
  const state=document.getElementById('ckState').value.trim();
  if(!name||!phone||!addr||!city||!state||!pincode){alert('Please fill in Name, Phone, Address, City, State and Pincode.');return;}
  if(!/^[0-9]{6}$/.test(pincode)){alert('Please enter a valid 6-digit pincode.');return;}
  if(ckState.payment==='cod'&&!cartCodInfo(loadCart()).ok){alert('Cash on Delivery is not available for this order. Please choose Pay Online.');return;}
  const cart=loadCart();
  const discount=ckState.discount||0;
  const sh=calcShipping(cart,Math.max(0,subtotal-discount));
  const shipping=sh.amount;
  const total=Math.max(0,subtotal-discount)+shipping;
  const orderId='KZ'+Date.now().toString().slice(-8);
  const itemsText=cart.map(i=>`- ${i.name} | Size: ${i.size} | Colour: ${i.color} | Qty: ${i.qty} | Price: ₹${i.price*i.qty}`).join('\n');
  const fullAddress=`${addr}, ${landmark?landmark+', ':''}${city}, ${district?district+', ':''}${state} - ${pincode}`;
  const msg=waTpl(shipping)
    .replace('{shipping}',shipping>0?shipping:'0').replace('{orderId}',orderId).replace('{items}',itemsText)
    .replace('{subtotal}',subtotal).replace('{coupon}',ckState.coupon?ckState.coupon.code:'None').replace('{discount}',discount).replace('{total}',total)
    .replace('{name}',name).replace('{phone}',phone).replace('{address}',addr)
    .replace('{landmark}',landmark||'-').replace('{city}',city).replace('{district}',district||'-').replace('{state}',state).replace('{pincode}',pincode);
  const mk=label=>msg.replace('{payment}',label);
  const newOrder=({id:orderId,payStatus:ckState.payment==='online'?'Awaiting Payment':'',items:cart,subtotal,discount,shipping,shipFree:!!sh.free,coupon:ckState.coupon?ckState.coupon.code:'',total,payment:ckState.payment,
    name,phone,address:fullAddress,addrDetail:{line:addr,landmark,city,district,state,pincode},status:'Pending',courier:'',trackingNumber:'',trackingUrl:'',trackingNote:'',shippedAt:'',deliveredAt:'',confirmedAt:'',outForDeliveryAt:'',cancelledAt:'',date:new Date().toISOString()});
  if(ckState.payment==='online'){payWithRazorpay(newOrder,mk);return;}
  finishOrder(newOrder,mk('Cash on Delivery'),true); /* COD: order goes straight to admin panel, no WhatsApp step */
}
function finishOrder(newOrder,msgFinal,skipWa){
  commitNew('orders',newOrder);
  anOnce('ordu');
  localStorage.setItem('kzr_last_phone',newOrder.phone);
  saveCart([]);
  if(!skipWa)openWhatsApp(msgFinal);
  location.hash='#/order/'+newOrder.id;
  window.scrollTo(0,0);
}

/* ---------------- RAZORPAY ONLINE PAYMENT ---------------- */
function loadRzp(cb){
  if(window.Razorpay)return cb();
  const sc=document.createElement('script');
  sc.src='https://checkout.razorpay.com/v1/checkout.js';
  sc.onload=cb;
  sc.onerror=()=>{alert('Could not load the payment gateway. Please check your internet and try again.');setPlaceBusy(false);};
  document.head.appendChild(sc);
}
function setPlaceBusy(b){const x=document.getElementById('ckPlaceBtn');if(x){x.disabled=b;x.style.opacity=b?.6:1;}}
function payWithRazorpay(order,mk){
  const key=((db.settings&&db.settings.razorpayKeyId)||'rzp_live_TijBdVc5FT2ljB').trim();
  if(!key){alert('Online payment is not active yet. Please choose Cash on Delivery or try again later.');return;}
  if(order.total<1){alert('Order total is too low for online payment.');return;}
  setPlaceBusy(true);
  loadRzp(()=>{
    const rz=new Razorpay({
      key:key,
      amount:Math.round(order.total*100),
      currency:'INR',
      name:db.settings.brand||'KAZERA',
      description:'Order #'+order.id,
      prefill:{name:order.name,contact:order.phone},
      notes:{order_id:order.id,customer:order.name,phone:order.phone,address:String(order.address).slice(0,200)},
      theme:{color:'#ffd21f'},
      modal:{ondismiss:function(){setPlaceBusy(false);}},
      handler:function(r){
        order.payStatus='Paid';
        order.gateway='razorpay';
        order.paymentId=r.razorpay_payment_id||'';
        finishOrder(order,mk('Paid Online via Razorpay (Payment ID: '+order.paymentId+')'));
      }
    });
    rz.on('payment.failed',function(r){
      setPlaceBusy(false);
      alert('Payment failed'+(r&&r.error&&r.error.description?': '+r.error.description:'')+'. Please try again.');
    });
    rz.open();
  });
}

  if(!confirm('Cancel order #'+o.id+'? This cannot be undone.'))return;
  o.status='Cancelled';o.cancelledAt=new Date().toISOString();
  patchItem('orders',id,{status:'Cancelled',cancelledAt:o.cancelledAt},()=>{
    const x=db.orders.find(y=>y.id===id);

function fileToSmall(file,maxW,q){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onerror=()=>res('');
    rd.onload=()=>{const im=new Image();
      im.onerror=()=>res('');
      im.onload=()=>{const w=Math.min(maxW,im.width),hh=Math.round(im.height*w/im.width);
        const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);
        res(c.toDataURL('image/jpeg',q));};
      im.src=rd.result;};
    rd.readAsDataURL(file);
  });
}
function submitReview(productId){
  const name=document.getElementById('rvName').value.trim()||'Anonymous';
  const rating=Math.min(5,Math.max(1,parseInt(document.getElementById('rvRating').value)||5));
  const text=document.getElementById('rvText').value.trim();
  const photoFile=document.getElementById('rvPhoto').files[0];
  const videoFile=document.getElementById('rvVideo').files[0];
  if(videoFile&&videoFile.size>2*1024*1024){alert('This video is too large. Please choose a video under 2 MB, or send it to us on WhatsApp.');return;}
  const finish=(photo,video)=>{
    const nr=({id:'r'+Date.now(),productId,name,rating,text,photo:photo||'',video:video||'',approved:false});
    commitNew('reviews',nr);
    alert('Thank you! Your review is submitted and will appear once approved.');
    location.hash='#/account';
  };
  const rp=photoFile?fileToSmall(photoFile,700,0.7):Promise.resolve('');
  const rv=videoFile?new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res('');r.readAsDataURL(videoFile);}):Promise.resolve('');
  Promise.all([rp,rv]).then(v=>finish(v[0],v[1]));
}

function updProdImage(id,idx,val){

  while(p.images.length<4)p.images.push('');

function handleProductImage(event,id,idx){
  const file=event.target.files[0];
  if(!file)return;
  const statusEl=document.getElementById('upload-status-'+id);
  if(!file.type.startsWith('image/')){if(statusEl)statusEl.textContent='Please choose an image file.';return;}
  if(statusEl)statusEl.textContent='Uploading...';
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=700;
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.72);
      try{
        updProdImage(id,idx,dataUrl);
        renderAdminTab();
      }catch(err){
        if(statusEl)statusEl.textContent='Image too large to save. Try a smaller photo.';
      }
    };

function stampOrder(o,status){

  if(status==='Shipped')o.shippedAt=o.shippedAt||now;
  if(status==='Out for Delivery'){o.shippedAt=o.shippedAt||now;o.outForDeliveryAt=o.outForDeliveryAt||now;}
  if(status==='Delivered')o.deliveredAt=o.deliveredAt||now;

}

function handleBannerImage(e){

  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const W=Math.min(1000,im.width),H=Math.round(im.height*W/im.width);
    const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);
    updSetting('shopBanner.image',c.toDataURL('image/jpeg',0.7));renderAdminTab();
  };im.src=rd.result;};
  rd.readAsDataURL(f);
}

function rxVal(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function maskUpi(u){const i=u.indexOf('@');return u.slice(0,2)+'•••'+(i>=0?u.slice(i):'');}
function submitReturn(){
  const o=db.orders.find(x=>x.id===rxState.id);if(!o)return;
  const items=[];
  document.querySelectorAll('#rx-box .rx-chk').forEach(c=>{
    if(!c.checked)return;
    const i=o.items[+c.value],sel=document.getElementById('rxsz'+c.value);
    items.push({id:i.id||'',name:i.name,size:i.size||'',color:i.color||'',qty:i.qty,price:i.price||0,newSize:(rxState.type==='Exchange'&&sel)?sel.value:''});
  });
  if(!items.length){alert('Please select at least one item.');return;}
  const reason=rxVal('rxReason'),note=rxVal('rxNote');
  if(reason==='Other'&&!note){alert('Please describe the issue in the details box.');return;}
  const rid='RX'+Date.now().toString().slice(-8);
  let pay=null,via='',hint='';
  if(rxState.type==='Return'){
    if(rxPayMode==='upi'){
      const u=rxVal('rxUpi').replace(/\s+/g,'');
      if(!/^[a-zA-Z0-9._-]{2,256}@[a-zA-Z][a-zA-Z0-9]{1,63}$/.test(u)){alert('Please enter a valid UPI ID, for example name@okaxis.');return;}
      pay={mode:'UPI',upi:u,name:rxVal('rxUpiName')};via='UPI';hint=maskUpi(u);
    }else{
      const nm=rxVal('rxBkName'),ac=rxVal('rxBkAcc').replace(/\s+/g,''),ac2=rxVal('rxBkAcc2').replace(/\s+/g,''),ifsc=rxVal('rxBkIfsc').toUpperCase().replace(/\s+/g,'');
      if(nm.length<3){alert('Please enter the account holder name.');return;}
      if(!/^[0-9]{9,18}$/.test(ac)){alert('Account number should be 9 to 18 digits.');return;}
      if(ac!==ac2){alert('Account numbers do not match.');return;}
      if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)){alert('Please enter a valid 11-character IFSC code, for example SBIN0001234.');return;}
      pay={mode:'Bank',holder:nm,account:ac,ifsc:ifsc,bank:rxVal('rxBkBank')};via='Bank';hint='A/c ••••'+ac.slice(-4)+' · '+ifsc.slice(0,4);
    }
    pay.requestId=rid;pay.orderId=o.id;pay.customer=o.name||'';pay.phone=o.phone||'';pay.at=new Date().toISOString();
  }
  const type=rxState.type;
  const finish=()=>{
    db.returns=db.returns||[];
    const newRx=({id:rid,orderId:o.id,type:type,items:items,reason:reason,note:note,status:'Pending',adminNote:'',date:new Date().toISOString(),updatedAt:'',name:o.name||'',phone:o.phone||'',
      refundVia:via,refundHint:hint,refundAmount:'',refundStatus:type==='Return'?'Not started':'',refundRef:''});
    commitNew('returns',newRx);closeRx();renderOrderDetail(o.id);
    alert('Your '+type.toLowerCase()+' request has been sent. We will update the status on this page.');
  };
  if(pay){payoutSave(rid,pay).then(finish).catch(()=>alert('Could not save your refund details. Please check your connection and try again.'));}
  else finish();
}

/* ---------------- SHIPPING ---------------- */
function calcShipping(items,payable){
  const min=+((db.settings&&db.settings.freeShipMin)||0);
  const seen={};let raw=0;
  (items||[]).forEach(i=>{
    const p=(db.products||[]).find(x=>x.id===i.id)||{};const c=+p.ship||0;if(!c)return;
    if(p.shipMode==='once'){if(!seen[i.id]){seen[i.id]=1;raw+=c;}}else raw+=c*(+i.qty||1);
  });
  const free=raw>0&&min>0&&payable>=min;
  return {raw:raw,amount:free?0:raw,free:free,min:min};
}
function shipLine(p){
  const c=+p.ship||0;if(!c)return '';
  const min=+((db.settings&&db.settings.freeShipMin)||0);
  return `<div class="ship-line">${IC.truck}<span>Shipping ₹${c}${p.shipMode==='once'?'':' per piece'}${min?' · Free on orders above ₹'+min:''}</span></div>`;
}
function cartTotalsHtml(cart,sub){
  const sh=calcShipping(cart,sub);
  const totalRow=v=>`<div style="display:flex;justify-content:space-between;padding:20px 0;font-size:18px;font-weight:800"><span>Total</span><span>₹${v}</span></div>`;
  if(sh.raw<=0)return totalRow(sub);
  const hint=(!sh.free&&sh.min>0&&sub<sh.min)?`<div style="font-size:12px;color:var(--accent);padding-top:4px">Add ₹${sh.min-sub} more to get free shipping</div>`:'';
  return `<div style="padding-top:16px;font-size:14px;color:var(--muted)"><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Subtotal</span><span>₹${sub}</span></div>
    <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Shipping</span><span>${sh.amount>0?'₹'+sh.amount:'FREE'}</span></div>${hint}</div>${totalRow(sub+sh.amount)}`;
}
function shipRow(o){
  if(o.shipping>0)return `<div class="od-row"><span>Shipping</span><span>₹${o.shipping}</span></div>`;
  if(o.shipFree)return `<div class="od-row g"><span>Shipping</span><span>FREE</span></div>`;
  return '';
}
function waTpl(shipping){
  let t=db.settings.waTemplate||'';
  if(!t.includes('{shipping}')&&shipping>0)t=t.replace(/(Total Payable)/,'Shipping: ₹{shipping}\n$1');
  return t;
}
function shippingCard(){
  const s=db.settings;
  return `<div class="admin-card"><strong>Shipping</strong>
    <p style="color:var(--muted);font-size:12px;margin:6px 0 4px">Set the shipping charge for each product in <b>Products</b>. Here you can set a free-shipping limit, or apply one charge to every product at once.</p>
    <div class="row2"><div class="form-field"><label>Free shipping above (₹) — 0 = off</label><input type="number" min="0" value="${+s.freeShipMin||0}" onchange="updSetting('freeShipMin',Math.max(0,+this.value||0))"></div>
    <div class="form-field"><label>Set one charge for all products (₹)</label><div style="display:flex;gap:8px"><input id="bulkShip" type="number" min="0" placeholder="e.g. 80"><button class="small-btn" onclick="bulkShip()">Apply to all</button></div></div></div>
    <p style="color:var(--muted);font-size:11px">To show shipping in the WhatsApp order message, add <code>Shipping: ₹{shipping}</code> to the Order Message Template below. It is added automatically when the template has no {shipping}.</p></div>`;
}
function bulkShip(){
  const v=document.getElementById('bulkShip').value;if(v==='')return;
  const n=Math.max(0,+v||0);
  if(!confirm('Set shipping to ₹'+n+' for all '+db.products.length+' products?'))return;
  db.products.forEach(p=>{p.ship=n;p.shipMode=p.shipMode||'unit';});saveDB(db);renderAdminTab();
}

/* ---------------- REFUND DETAILS (kept in a separate, admin-only database node) ---------------- */
const PAY_NODE='kzr_payouts_v1';
const payCache={};
function payoutSave(rid,data){
  if(firebaseReady)return firebase.database().ref(PAY_NODE+'/'+rid).set(data);
  try{const m=JSON.parse(localStorage.getItem(PAY_NODE)||'{}');m[rid]=data;localStorage.setItem(PAY_NODE,JSON.stringify(m));return Promise.resolve();}catch(e){return Promise.reject(e);}
}
function payoutGet(rid){
  if(firebaseReady)return firebase.database().ref(PAY_NODE+'/'+rid).once('value').then(s=>s.val());
  try{return Promise.resolve((JSON.parse(localStorage.getItem(PAY_NODE)||'{}'))[rid]||null);}catch(e){return Promise.resolve(null);}
}
function payoutDel(rid){
  if(!confirm('Delete the saved payment details for this request? This cannot be undone.'))return;
  const done=()=>{delete payCache[rid];fillPayouts();};
  if(firebaseReady){firebase.database().ref(PAY_NODE+'/'+rid).remove().then(done).catch(()=>alert('Could not delete. Make sure you are logged in as admin.'));}
  else{try{const m=JSON.parse(localStorage.getItem(PAY_NODE)||'{}');delete m[rid];localStorage.setItem(PAY_NODE,JSON.stringify(m));}catch(e){}done();}
}
function copyText(t,btn){
  const ok=()=>{if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>prompt('Copy:',t));else prompt('Copy:',t);
}
function copyPay(rid,k,btn){const p=payCache[rid];if(p&&p[k])copyText(String(p[k]),btn);}
function copyPayAll(rid,btn){
  const p=payCache[rid];if(!p)return;
  const t=p.mode==='UPI'?'UPI ID: '+p.upi+(p.name?'\nName: '+p.name:''):'Account holder: '+p.holder+'\nAccount number: '+p.account+'\nIFSC: '+p.ifsc+(p.bank?'\nBank: '+p.bank:'');
  copyText(t,btn);
}
function payUpi(rid){
  const p=payCache[rid];if(!p||!p.upi)return;
  const amt=(document.getElementById('rx-amt-'+rid)||{}).value||'';
  const q='pa='+encodeURIComponent(p.upi)+(p.name?'&pn='+encodeURIComponent(p.name):'')+(+amt>0?'&am='+(+amt).toFixed(2):'')+'&cu=INR&tn='+encodeURIComponent('Refund order '+(p.orderId||''));
  location.href='upi://pay?'+q;
}
function payHtml(rid,p){
  if(!p)return '<div style="font-size:12px;color:var(--muted)">No payment details on file (deleted, or not submitted).</div>';
  const row=(l,k)=>p[k]?`<div class="pay-row"><span style="color:var(--muted)">${l}</span><span><b>${esc(String(p[k]))}</b> <button class="small-btn" onclick="copyPay('${rid}','${k}',this)">Copy</button></span></div>`:'';
  const body=p.mode==='UPI'?row('UPI ID','upi')+row('Name on UPI','name'):row('Account holder','holder')+row('Account number','account')+row('IFSC','ifsc')+row('Bank','bank');
  return `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Refund via ${esc(p.mode||'')}</div>${body}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${p.mode==='UPI'?`<button class="small-btn" onclick="payUpi('${rid}')" title="Opens your UPI app on a phone">Pay in UPI app</button>`:''}<button class="small-btn" onclick="copyPayAll('${rid}',this)">Copy all</button><button class="small-btn" style="color:#ff8080" onclick="payoutDel('${rid}')">Delete details</button></div>`;
}
function fillPayouts(){
  document.querySelectorAll('[data-pay]').forEach(el=>{
    const rid=el.getAttribute('data-pay');
    el.innerHTML='<span style="color:var(--muted);font-size:12px">Loading payment details…</span>';
    payoutGet(rid).then(p=>{payCache[rid]=p;el.innerHTML=payHtml(rid,p);})
      .catch(()=>{el.innerHTML='<span style="color:#ff8080;font-size:12px">Could not load payment details. Log in as admin and check the Firebase rules.</span>';});
  });
}

/* ---------------- SITE SPEED (admin) ---------------- */
function mb(n){return (n/1048576).toFixed(2)+' MB';}
function speedStats(){
  const L=s=>(typeof s==='string'?s.length:0);
  const prod=db.products.reduce((a,p)=>a+(p.images||[]).reduce((b,i)=>b+L(i),0)+L(p.img),0);
  const banner=L((db.settings.shopBanner||{}).image);
  const rvp=(db.reviews||[]).reduce((a,r)=>a+L(r.photo),0);
  const vids=(db.reviews||[]).filter(r=>r.video);
  const rvv=vids.reduce((a,r)=>a+L(r.video),0);
  let total=0;try{total=JSON.stringify(pub(db)).length;}catch(e){}
  return {prod:prod,banner:banner,rvp:rvp,rvv:rvv,vids:vids.length,total:total,rest:Math.max(0,total-prod-banner-rvp-rvv)};
}
function speedCard(){
  const s=speedStats(),bad=s.total>3*1048576,mid=s.total>1.5*1048576;
  const col=bad?'#ff8080':mid?'#ffd66b':'#7dffa0';
  const row=(l,v)=>`<tr><td>${l}</td><td style="text-align:right">${mb(v)}</td></tr>`;
  return `<div class="admin-card"><strong>Site speed</strong>
    <p style="color:var(--muted);font-size:12px;margin:6px 0 0">Every visitor's phone downloads all of this data before the site opens, so a smaller size means a faster site. Aim for under 2 MB.</p>
    <div style="font-size:24px;font-weight:800;color:${col};margin:10px 0 4px">${mb(s.total)} <span style="font-size:12px;font-weight:400;color:var(--muted)">${bad?'too heavy, optimize below':mid?'a bit heavy':'looks good'}</span></div>
    <table style="margin:8px 0 12px">${row('Product photos',s.prod)}${row('Banner image',s.banner)}${row('Review photos',s.rvp)}${row('Review videos ('+s.vids+')',s.rvv)}${row('Orders, settings and other data',s.rest)}</table>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="small-btn" onclick="optimizeImages()">Optimize all images</button>${s.vids?`<button class="small-btn" style="color:#ff8080" onclick="removeReviewVideos()">Remove review videos</button>`:''}</div>
    <div id="optStatus" style="font-size:12px;color:var(--muted);margin-top:10px"></div></div>`;
}
function recompress(dataUrl,maxW,q){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onerror=()=>rej(new Error('img'));
    im.onload=()=>{const w=Math.min(maxW,im.width),hh=Math.round(im.height*w/im.width);
      const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);
      res(c.toDataURL('image/jpeg',q));};
    im.src=dataUrl;
  });
}
async function optimizeImages(){
  const st=document.getElementById('optStatus');
  const before=speedStats().total;let n=0;
  const shrink=async(v,w,q)=>{
    if(typeof v!=='string'||!v.startsWith('data:image')||v.length<90000)return v;
    try{const o=await recompress(v,w,q);if(o&&o.length<v.length*0.9){n++;return o;}}catch(e){}
    return v;
  };
  try{
    st.textContent='Optimizing photos, please wait…';
    for(const p of db.products){
      if(p.images)for(let i=0;i<p.images.length;i++)p.images[i]=await shrink(p.images[i],700,0.72);
      if(p.img)p.img=await shrink(p.img,700,0.72);
    }
    const b=db.settings.shopBanner;if(b&&b.image)b.image=await shrink(b.image,1000,0.7);
    for(const r of (db.reviews||[]))if(r.photo)r.photo=await shrink(r.photo,700,0.7);
    saveDB(db);
    const after=speedStats().total;
    renderAdminTab();
    const e=document.getElementById('optStatus');
    if(e)e.textContent=n?`Done. ${n} image${n===1?'':'s'} optimized: ${mb(before)} → ${mb(after)}.`:'Your images are already small. Nothing to optimize.';
  }catch(e){st.textContent='Something went wrong. Please try again.';}
}
function removeReviewVideos(){
  const n=(db.reviews||[]).filter(r=>r.video).length;
  if(!n)return;
  if(!confirm('Remove the videos from '+n+' review(s)? The review text and photos stay. This cannot be undone.'))return;
  db.reviews.forEach(r=>{r.video='';});saveDB(db);renderAdminTab();
}

/* ---------------- SAFE WRITES for lists many people change at once ----------------
   Orders, return requests and reviews are saved with Firebase transactions: each save is applied on top of the
   latest data on the server, so two customers ordering in the same second can never overwrite each other. */
const ORDER_KEYS=['payStatus','status','courier','trackingNumber','trackingUrl','trackingNote','confirmedAt','shippedAt','outForDeliveryAt','deliveredAt','cancelledAt'];
const RX_KEYS=['status','adminNote','updatedAt','refundAmount','refundStatus','refundRef','refundedAt'];
function toArr(v){return (Array.isArray(v)?v:Object.values(v||{})).filter(Boolean);}
function pick(o,keys){const r={};keys.forEach(k=>{if(o[k]!==undefined)r[k]=o[k];});return r;}
function safeList(key,mutate,done){
  db[key]=toArr(db[key]);mutate(db[key]);            /* instant update on this device */
  if(!firebaseReady||!dbRef){saveDB(db);if(done)done(true);return;}
  dbRef.child(key).transaction(cur=>{const a=toArr(cur);mutate(a);return a;},(err,ok,snap)=>{
    if(err)console.error('KAZERA: save failed —',err);
    if(!err&&ok&&snap){const v=toArr(snap.val());db[key]=v;lastKeys[key]=JSON.stringify(v);}
    if(done)done(!err&&!!ok);
  });
}
function patchItem(key,id,patch,done,guard){
  safeList(key,a=>{const x=a.find(y=>y.id===id);if(x&&(!guard||guard(x)))Object.assign(x,patch);},done);
}
function removeItem(key,id){
  safeList(key,a=>{const i=a.findIndex(y=>y.id===id);if(i>=0)a.splice(i,1);});
}
/* new entries are remembered on this device until the server confirms them (and re-sent next visit if the tab was closed too early) */
const PEND_KEY='kzr_pending_v1';
function pendGet(){try{return JSON.parse(localStorage.getItem(PEND_KEY)||'[]');}catch(e){return [];}}
function pendSet(a){try{localStorage.setItem(PEND_KEY,JSON.stringify(a));}catch(e){}}
function pendingDel(id){pendSet(pendGet().filter(p=>p.item.id!==id));}
function addOnce(key,item){safeList(key,a=>{if(!a.some(x=>x.id===item.id))a.push(item);},ok=>{if(ok)pendingDel(item.id);});}
function commitNew(key,item){const a=pendGet();a.push({key:key,item:item});pendSet(a);addOnce(key,item);}
function flushPending(){pendGet().forEach(p=>addOnce(p.key,p.item));}

/* ---------------- ANALYTICS ----------------
   Only anonymous daily counters are stored, in their own database node (kzr_stats_v1), so they never slow the shop down.
   Each visitor is counted once per day per device for every funnel step. */
const AN_NODE='kzr_stats_v1';
let anPeriod='7',anData={};
function anDay(ms){return new Date((ms||Date.now())+19800000).toISOString().slice(0,10);} /* India date */
function anSkip(){try{return localStorage.getItem('kzr_no_track')==='1';}catch(e){return false;}}
function anFlags(){const d=anDay();try{const f=JSON.parse(localStorage.getItem('kzr_an')||'{}');return f.d===d?f:{d:d};}catch(e){return {d:d};}}
function anBump(day,key){
  if(firebaseReady&&typeof firebase!=='undefined'){
    firebase.database().ref(AN_NODE+'/days/'+day+'/'+key).set(firebase.database.ServerValue.increment(1)).catch(()=>{});
  }else{
    try{const m=JSON.parse(localStorage.getItem(AN_NODE)||'{}');m[day]=m[day]||{};m[day][key]=(m[day][key]||0)+1;localStorage.setItem(AN_NODE,JSON.stringify(m));}catch(e){}
  }
}
function anTrack(key){if(anSkip())return;try{anBump(anDay(),key);}catch(e){}}
function anOnce(key){
  if(anSkip())return;
  try{const f=anFlags();if(f[key])return;f[key]=1;localStorage.setItem('kzr_an',JSON.stringify(f));anBump(f.d,key);}catch(e){}
}
function anPage(p0){
  anOnce('v');
  if(p0==='product'){anTrack('pv');anOnce('pvu');}
  else if(p0==='checkout'&&loadCart().length)anOnce('cou');
}
function anDays(period){
  if(period==='all')return Object.keys(anData).sort();
  const n=period==='today'?1:+period,out=[];
  for(let i=n-1;i>=0;i--)out.push(anDay(Date.now()-i*86400000));
  return out;
}
function anOrderDay(o){const t=new Date(o.date).getTime();return isNaN(t)?'':anDay(t);}
function adminAnalytics(){
  return `<h2>Analytics</h2>
  <p style="color:var(--muted);font-size:13px;margin:-8px 0 18px">How visitors move through your shop. Only anonymous daily counts are saved, no personal data. Each visitor is counted once per day per device.</p>
  <div class="admin-toolbar"><select onchange="anPeriod=this.value;anPaint()">${[['today','Today'],['7','Last 7 days'],['30','Last 30 days'],['all','All time']].map(x=>`<option value="${x[0]}" ${anPeriod===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="small-btn" onclick="anLoad()">Refresh</button></div>
  <div id="anBody"><p style="color:var(--muted)">Loading…</p></div>
  <div class="admin-card"><strong>Tracking</strong>
    <p style="color:var(--muted);font-size:12px;margin:6px 0 10px">Your own visits are not counted on any device where you have opened this admin panel. Counting starts from the day this version is uploaded.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="small-btn" onclick="anToggleSkip()">${anSkip()?'Count my visits on this device again':'Do not count this device'}</button><button class="small-btn" style="color:#ff8080" onclick="anReset()">Reset analytics</button></div></div>`;
}
function anLoad(){
  const fail=()=>{const e=document.getElementById('anBody');if(e)e.innerHTML='<p style="color:#ff8080;font-size:13px">Could not load analytics. Log in as admin and make sure the new Firebase rules (kzr_stats_v1) are published.</p>';};
  if(firebaseReady&&typeof firebase!=='undefined'){
    firebase.database().ref(AN_NODE+'/days').once('value').then(s=>{anData=s.val()||{};anPaint();}).catch(fail);
  }else{try{anData=JSON.parse(localStorage.getItem(AN_NODE)||'{}');}catch(e){anData={};}anPaint();}
}
function anPaint(){
  const el=document.getElementById('anBody');if(!el)return;
  const days=anDays(anPeriod),set={};days.forEach(d=>{set[d]=1;});
  const sum=k=>days.reduce((a,d)=>a+(((anData[d]||{})[k])||0),0);
  const v=sum('v'),pvu=sum('pvu'),pv=sum('pv'),atcu=sum('atcu'),atc=sum('atc'),cou=sum('cou'),ordu=sum('ordu');
  const abandoned=days.reduce((a,d)=>{const x=anData[d]||{};return a+Math.max(0,(x.atcu||0)-(x.ordu||0));},0);
  const inRange=db.orders.filter(o=>set[anOrderDay(o)]);
  const cancelled=inRange.filter(o=>o.status==='Cancelled').length;
  const sales=inRange.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+(+o.total||0),0);
  const conv=v?ordu/v*100:0;
  const card=(n,l,sub)=>`<div class="stat-card"><div class="num">${n}</div><div class="lbl">${l}</div>${sub?`<div class="lbl" style="font-size:11px;opacity:.7;margin-top:2px">${sub}</div>`:''}</div>`;
  const stages=[['Visitors',v],['Viewed a product',pvu],['Added to cart',atcu],['Started checkout',cou],['Placed an order',ordu]];
  const funnel=stages.map((s,i)=>{
    const w=v?Math.min(100,s[1]/v*100):0,pct=v?Math.round(s[1]/v*100):0;
    return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${s[0]}</span><b>${s[1]}${i?` <span style="color:var(--muted);font-weight:400">(${pct}%)</span>`:''}</b></div><div style="background:var(--black);border:1px solid var(--line2);height:12px"><div style="background:var(--accent);height:100%;width:${w}%"></div></div></div>`;
  }).join('');
  const rows=days.slice(-14).reverse().map(d=>{const x=anData[d]||{};return `<tr><td>${d}</td><td>${x.v||0}</td><td>${x.pv||0}</td><td>${x.atc||0}</td><td>${db.orders.filter(o=>anOrderDay(o)===d).length}</td></tr>`;}).join('');
  el.innerHTML=`<div class="stat-grid">
    ${card(v,'Total Visitors')}
    ${card(pv,'Product Views',pvu+' visitors')}
    ${card(atc,'Add to Cart',atcu+' visitors')}
    ${card(cou,'Checkout Started')}
    ${card(inRange.length,'Orders',cancelled?cancelled+' cancelled':'')}
    ${card('₹'+sales,'Total Sales','excluding cancelled')}
    ${card(abandoned,'Cart Abandoned','added to cart, no order')}
    ${card(conv.toFixed(1)+'%','Conversion Rate','visitors who ordered')}
  </div>
  <div class="admin-card"><strong>Visitor journey</strong><p style="color:var(--muted);font-size:12px;margin-top:4px">Visitors → Product → Cart → Checkout → Order</p>${funnel}</div>
  <div class="admin-card"><strong>Day by day</strong><div style="overflow-x:auto;margin-top:8px"><table><tr><th>Date</th><th>Visitors</th><th>Product views</th><th>Add to cart</th><th>Orders</th></tr>${rows||'<tr><td colspan="5">No data yet</td></tr>'}</table></div></div>`;
}
function anToggleSkip(){
  try{if(anSkip())localStorage.removeItem('kzr_no_track');else localStorage.setItem('kzr_no_track','1');}catch(e){}
  renderAdminTab();
}
function anReset(){
  if(!confirm('Delete ALL analytics numbers? Orders are not affected. This cannot be undone.'))return;
  const done=()=>{anData={};anPaint();};
  if(firebaseReady&&typeof firebase!=='undefined'){firebase.database().ref(AN_NODE).remove().then(done).catch(()=>alert('Could not reset. Log in as admin and check the Firebase rules.'));}
  else{try{localStorage.removeItem(AN_NODE);}catch(e){}done();}
}
</script>
